<svg xmlns="http://www.w3.org/2000/svg" width="700" height="660" viewBox="0 0 700 660" role="img" aria-labelledby="title desc">
  <title id="title">The AI engineering job search loop</title>
  <desc id="desc">Networking leads to applications, applications reveal which skills to build, projects and interviews follow, and reflecting on each round sends you back to networking with a better picture of the market.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#7c3aed"/></marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#2563eb"/></marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#c2410c"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#15803d"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#dc2626"/></marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#64748b"/></marker>
    <symbol id="icon-document" viewBox="0 0 24 24">
        <path d="M6 2h8l4 4v16H6Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M14 2v5h4M9 12h6M9 16h6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </symbol>
    <symbol id="icon-github" viewBox="0 0 24 24">
        <path fill="currentColor" d="M12 .7a11.5 11.5 0 0 0-3.64 22.41c.58.11.79-.25.79-.56v-2.23c-3.22.7-3.9-1.37-3.9-1.37-.53-1.34-1.29-1.7-1.29-1.7-1.05-.72.08-.71.08-.71 1.17.08 1.78 1.2 1.78 1.2 1.04 1.77 2.72 1.26 3.38.96.1-.75.4-1.26.74-1.55-2.57-.29-5.27-1.28-5.27-5.68 0-1.26.45-2.28 1.19-3.09-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.16 1.18a10.9 10.9 0 0 1 5.76 0c2.2-1.49 3.16-1.18 3.16-1.18.63 1.59.23 2.76.11 3.05.74.81 1.19 1.83 1.19 3.09 0 4.42-2.71 5.38-5.29 5.67.42.36.79 1.06.79 2.14v3.27c0 .31.21.67.8.56A11.5 11.5 0 0 0 12 .7Z"/>
      </symbol>
    <symbol id="icon-message" viewBox="0 0 24 24">
        <path d="M4 4h16v12H9l-5 4Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M8 9h8M8 13h5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </symbol>
    <symbol id="icon-search" viewBox="0 0 24 24">
        <circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="m16 16 4.5 4.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </symbol>
    <symbol id="icon-user" viewBox="0 0 24 24">
        <circle cx="12" cy="8" r="4" fill="none" stroke="currentColor" stroke-width="1.3" vector-effect="non-scaling-stroke"/>
        <path d="M4 22c.6-5 3.3-7 8-7s7.4 2 8 7" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
      </symbol>
    <style>
      text { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      .node rect { stroke-width: 2; }
      .node-title { font-size: 20px; font-weight: 750; text-anchor: middle; }
      .node-title.icon-copy { text-anchor: start; }
      .node-subtitle { font-size: 16px; font-weight: 500; fill: #7a8699; text-anchor: middle; }
      .eyebrow { font-size: 13px; font-weight: 750; letter-spacing: 1px; fill: #64748b; text-anchor: middle; }
      .mention-icon { font-size: 27px; font-weight: 750; text-anchor: middle; }
      .standalone-mention { font-size: 52px; font-weight: 750; text-anchor: middle; }
      .icon-node-title { font-size: 16px; font-weight: 750; text-anchor: middle; }
      .edge { fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
      .edge-label rect { stroke-width: 2; }
      .edge-label text { font-size: 14px; font-weight: 750; text-anchor: middle; dominant-baseline: central; }
      .divider { stroke: #cbd5e1; stroke-width: 2; stroke-dasharray: 6 8; stroke-linecap: round; }
      .center-annotation { fill: #f1f5f9; stroke: none; }
      .center-title { font-weight: 800; letter-spacing: 0.08em; fill: #334155; text-anchor: middle; }
      .center-detail { font-weight: 600; fill: #64748b; text-anchor: middle; }
    </style>
  </defs>
  <rect width="700" height="660" fill="#ffffff"/>

  <path class="edge" d="M445 146.45A226.06 226.06 0 0 1 538.46 226.73" stroke="#64748b" marker-end="url(#arrow-gray)"/>
  <path class="edge" d="M575.58 336.73A226.06 226.06 0 0 1 536.41 479.48" stroke="#64748b" marker-end="url(#arrow-gray)"/>
  <path class="edge" d="M387.88 574.46A226.06 226.06 0 0 1 312.12 574.46" stroke="#64748b" marker-end="url(#arrow-gray)"/>
  <path class="edge" d="M163.59 479.48A226.06 226.06 0 0 1 124.42 336.73" stroke="#64748b" marker-end="url(#arrow-gray)"/>
  <path class="edge" d="M161.54 226.73A226.06 226.06 0 0 1 255 146.45" stroke="#64748b" marker-end="url(#arrow-gray)"/>

  <g class="node node-blue" transform="translate(255 70.52)" filter="url(#shadow)">
    <rect width="190" height="110" rx="18" fill="#eff6ff" stroke="#2563eb"/>
    <text class="eyebrow" x="95" y="28.62" font-size="18">STEP 1</text>
    <use href="#icon-user" x="16.42" y="42.12" width="46" height="46" color="#2563eb"/>
    <text class="node-title icon-copy" x="70.94" y="74.84" font-size="27" textLength="94.96" lengthAdjust="spacingAndGlyphs">Network</text>
  </g>
  <g class="node node-blue" transform="translate(470 226.73)" filter="url(#shadow)">
    <rect width="190" height="110" rx="18" fill="#eff6ff" stroke="#2563eb"/>
    <text class="eyebrow" x="95" y="28.62" font-size="18">STEP 2</text>
    <use href="#icon-document" x="20.7" y="42.12" width="46" height="46" color="#2563eb"/>
    <text class="node-title icon-copy" x="73.33" y="74.84" font-size="27">Apply</text>
  </g>
  <g class="node node-blue" transform="translate(387.88 479.48)" filter="url(#shadow)">
    <rect width="190" height="110" rx="18" fill="#eff6ff" stroke="#2563eb"/>
    <text class="eyebrow" x="95" y="28.62" font-size="18">STEP 3</text>
    <use href="#icon-github" x="25.25" y="42.12" width="46" height="46" color="#2563eb"/>
    <text class="node-title icon-copy" x="86.3" y="74.84" font-size="27">Build</text>
  </g>
  <g class="node node-blue" transform="translate(122.12 479.48)" filter="url(#shadow)">
    <rect width="190" height="110" rx="18" fill="#eff6ff" stroke="#2563eb"/>
    <text class="eyebrow" x="95" y="28.62" font-size="18">STEP 4</text>
    <use href="#icon-message" x="18.35" y="42.12" width="46" height="46" color="#2563eb"/>
    <text class="node-title icon-copy" x="74.8" y="74.84" font-size="27" textLength="91.1" lengthAdjust="spacingAndGlyphs">Interview</text>
  </g>
  <g class="node node-purple" transform="translate(40 226.73)" filter="url(#shadow)">
    <rect width="190" height="110" rx="18" fill="#f5f3ff" stroke="#7c3aed"/>
    <text class="eyebrow" x="95" y="28.62" font-size="18">STEP 5</text>
    <use href="#icon-search" x="17.2" y="42.12" width="46" height="46" color="#7c3aed"/>
    <text class="node-title icon-copy" x="74.43" y="74.84" font-size="27" textLength="91.47" lengthAdjust="spacingAndGlyphs">Reflect</text>
  </g>
</svg>
