<svg xmlns="http://www.w3.org/2000/svg" width="920" height="760" viewBox="0 0 920 760" role="img" aria-labelledby="title desc">
  <title id="title">The AI engineering job search loop</title>
  <desc id="desc">Networking leads to applications, applications reveal which skills to build, projects and interviews follow, and reflecting on each round sends you back to networking with a better picture of the market.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#7c3aed"/></marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#2563eb"/></marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#c2410c"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#15803d"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#dc2626"/></marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#64748b"/></marker>
    <symbol id="icon-check" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="m7.5 12 3 3 6-7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </symbol>
    <symbol id="icon-document" viewBox="0 0 24 24">
        <path d="M6 2h8l4 4v16H6Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M14 2v5h4M9 12h6M9 16h6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </symbol>
    <symbol id="icon-message" viewBox="0 0 24 24">
        <path d="M4 4h16v12H9l-5 4Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M8 9h8M8 13h5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </symbol>
    <symbol id="icon-settings" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9 7 7M17 17l2.1 2.1M19.1 4.9 17 7M7 17l-2.1 2.1" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </symbol>
    <symbol id="icon-user" viewBox="0 0 24 24">
        <circle cx="12" cy="8" r="4" fill="none" stroke="currentColor" stroke-width="1.75" vector-effect="non-scaling-stroke"/>
        <path d="M4 22c.6-5 3.3-7 8-7s7.4 2 8 7" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
      </symbol>
    <style>
      text { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      .node rect { stroke-width: 2; }
      .node-title { font-size: 16px; font-weight: 750; text-anchor: middle; }
      .node-title.icon-copy { text-anchor: start; }
      .node-subtitle { font-size: 14px; font-weight: 500; fill: #64748b; text-anchor: middle; }
      .node-subtitle.icon-copy { text-anchor: start; }
      .eyebrow { font-size: 12px; font-weight: 750; letter-spacing: 1px; fill: #64748b; text-anchor: middle; }
      .mention-icon { font-size: 27px; font-weight: 750; text-anchor: middle; }
      .standalone-mention { font-size: 52px; font-weight: 750; text-anchor: middle; }
      .icon-node-title { font-size: 16px; font-weight: 750; text-anchor: middle; }
      .edge { fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
      .edge-label rect { stroke-width: 2; }
      .edge-label text { font-size: 14px; font-weight: 750; text-anchor: middle; dominant-baseline: central; }
      .divider { stroke: #cbd5e1; stroke-width: 2; stroke-dasharray: 6 8; stroke-linecap: round; }
      .center-annotation { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 2; stroke-dasharray: 7 7; }
      .center-title { font-size: 16px; font-weight: 800; letter-spacing: 1.3px; fill: #334155; text-anchor: middle; }
      .center-detail { font-size: 13px; font-weight: 600; fill: #64748b; text-anchor: middle; }
    </style>
  </defs>
  <rect width="920" height="760" fill="#ffffff"/>

  <path class="edge" d="M597.92 131.79A310.18 310.18 0 0 1 724.47 247.55" stroke="#64748b" marker-end="url(#arrow-gray)"/>
  <path class="edge" d="M768.8 380.43A310.18 310.18 0 0 1 709.02 594.56" stroke="#64748b" marker-end="url(#arrow-gray)"/>
  <path class="edge" d="M517.32 660.56L402.68 660.56" stroke="#64748b" marker-end="url(#arrow-gray)"/>
  <path class="edge" d="M210.98 594.56A310.18 310.18 0 0 1 151.2 380.43" stroke="#64748b" marker-end="url(#arrow-gray)"/>
  <path class="edge" d="M195.53 247.55A310.18 310.18 0 0 1 322.08 131.79" stroke="#64748b" marker-end="url(#arrow-gray)"/>

  <circle class="center-annotation" cx="460" cy="409.62" r="85"/>
  <text class="center-title" x="460" y="404.62">JOB SEARCH</text>
  <text class="center-title" x="460" y="427.62">LOOP</text>
  <text class="center-detail" x="460" y="518.62">Each round tells you what to fix</text>

  <g class="node node-blue" transform="translate(335 45.44)" filter="url(#shadow)">
    <rect width="250" height="108" rx="18" fill="#eff6ff" stroke="#2563eb"/>
    <use href="#icon-user" x="16" y="30" width="28" height="28" color="#2563eb"/>
    <text class="node-title icon-copy" x="56" y="50">Network</text>
    <text class="node-subtitle icon-copy" x="16" y="75" textLength="218" lengthAdjust="spacingAndGlyphs">Meet people, ask for referrals</text>
  </g>
  <g class="node node-purple" transform="translate(630 259.77)" filter="url(#shadow)">
    <rect width="250" height="108" rx="18" fill="#f5f3ff" stroke="#7c3aed"/>
    <use href="#icon-document" x="16" y="30" width="28" height="28" color="#7c3aed"/>
    <text class="node-title icon-copy" x="56" y="50">Apply</text>
    <text class="node-subtitle icon-copy" x="16" y="75">Apply anyway, note the skills</text>
  </g>
  <g class="node node-amber" transform="translate(517.32 606.56)" filter="url(#shadow)">
    <rect width="250" height="108" rx="18" fill="#fff7ed" stroke="#c2410c"/>
    <use href="#icon-settings" x="16" y="30" width="28" height="28" color="#c2410c"/>
    <text class="node-title icon-copy" x="56" y="50">Build</text>
    <text class="node-subtitle icon-copy" x="16" y="75">Projects, README, blog post</text>
  </g>
  <g class="node node-green" transform="translate(152.68 606.56)" filter="url(#shadow)">
    <rect width="250" height="108" rx="18" fill="#ecfdf5" stroke="#15803d"/>
    <use href="#icon-message" x="16" y="30" width="28" height="28" color="#15803d"/>
    <text class="node-title icon-copy" x="56" y="50">Interview</text>
    <text class="node-subtitle icon-copy" x="16" y="75">Write down what they ask</text>
  </g>
  <g class="node node-gray" transform="translate(40 259.77)" filter="url(#shadow)">
    <rect width="250" height="108" rx="18" fill="#f8fafc" stroke="#64748b"/>
    <use href="#icon-check" x="16" y="30" width="28" height="28" color="#64748b"/>
    <text class="node-title icon-copy" x="56" y="50">Reflect</text>
    <text class="node-subtitle icon-copy" x="16" y="75" textLength="218" lengthAdjust="spacingAndGlyphs">Retrospective, then start again</text>
  </g>
</svg>
