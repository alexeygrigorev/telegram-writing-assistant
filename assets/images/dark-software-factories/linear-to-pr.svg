<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="300" viewBox="0 0 1440 300" role="img" aria-labelledby="title desc">
  <title id="title">A developer&#x27;s Linear-to-PR workflow</title>
  <desc id="desc">A ready Linear story starts an agent session that follows repository instructions, opens a pull request with a preview URL, and runs end-to-end checks before release.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#7c3aed"/></marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#2563eb"/></marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#c2410c"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#648900"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#dc2626"/></marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#737373"/></marker>
    <symbol id="icon-check" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="m7.5 12 3 3 6-7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </symbol>
    <symbol id="icon-issue" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="M12 7v6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="17" r="1.2" fill="currentColor"/>
      </symbol>
    <symbol id="icon-pull-request" viewBox="0 0 24 24">
        <circle cx="6" cy="5" r="2.5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="6" cy="19" r="2.5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="18" cy="19" r="2.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M6 7.5v9M15 5h1a2 2 0 0 1 2 2v9.5M13 2l3 3-3 3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </symbol>
    <symbol id="icon-robot" viewBox="0 0 24 24">
        <path d="M12 5V2.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        <circle cx="12" cy="2.5" r="1" fill="currentColor"/>
        <rect x="4" y="5" width="16" height="15" rx="3" fill="none" stroke="currentColor" stroke-width="1.8"/>
        <path d="M4 10H2.5v5H4M20 10h1.5v5H20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="9" cy="11" r="1.3" fill="currentColor"/>
        <circle cx="15" cy="11" r="1.3" fill="currentColor"/>
        <path d="M8.5 16h7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </symbol>
    <style>
      text { font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #171717; }
      symbol [stroke] { vector-effect: non-scaling-stroke; }
      .node rect { stroke-width: 2; }
      .node-boundary rect { stroke-width: 2; stroke-dasharray: 8 8; }
      .boundary-title { font-size: 16px; font-weight: 750; text-anchor: start; }
      .node-title { font-weight: 750; text-anchor: middle; }
      .node-title.icon-copy { text-anchor: start; }
      .node-subtitle { font-weight: 500; fill: #525252; text-anchor: middle; }
      .eyebrow { font-weight: 750; letter-spacing: 1px; fill: #525252; text-anchor: middle; }
      .mention-icon { font-size: 27px; font-weight: 750; text-anchor: middle; }
      .standalone-mention { font-size: 52px; font-weight: 750; text-anchor: middle; }
      .icon-node-title { font-size: 16px; font-weight: 750; text-anchor: middle; }
      .edge { fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
      .edge-label rect { stroke-width: 2; }
      .edge-label text { font-size: 14px; font-weight: 750; text-anchor: middle; dominant-baseline: central; }
      .divider { stroke: #d4d4d4; stroke-width: 2; stroke-dasharray: 6 8; stroke-linecap: round; }
      .center-annotation { fill: #f5f5f5; stroke: none; }
      .center-title { font-weight: 800; letter-spacing: 0.08em; fill: #404040; text-anchor: middle; }
      .center-detail { font-weight: 600; fill: #525252; text-anchor: middle; }
    </style>
  </defs>
  <rect width="1440" height="300" fill="#ffffff"/>

  <path class="edge" d="M309.6 105L410.4 105" stroke="#737373" marker-end="url(#arrow-gray)"/>
  <path class="edge" d="M669.6 105L770.4 105" stroke="#737373" marker-end="url(#arrow-gray)"/>
  <path class="edge" d="M1029.6 105L1130.4 105" stroke="#737373" marker-end="url(#arrow-gray)"/>

  <g class="node node-blue" transform="translate(50.4 58.5)" filter="url(#shadow)">
    <rect width="259.2" height="93" rx="18" fill="#eff6ff" stroke="#2563eb"/>
    <use href="#icon-issue" x="39.13" y="16.5" width="34" height="34" color="#2563eb"/>
    <text class="node-title icon-copy" x="82.31" y="40.7" font-size="20">Ready story</text>
    <text class="node-subtitle" x="129.6" y="71.5" font-size="16">Picked up from Linear</text>
  </g>
  <g class="node node-purple" transform="translate(410.4 58.5)" filter="url(#shadow)">
    <rect width="259.2" height="93" rx="18" fill="#f5f3ff" stroke="#7c3aed"/>
    <use href="#icon-robot" x="27.69" y="16.5" width="34" height="34" color="#7c3aed"/>
    <text class="node-title icon-copy" x="71.58" y="40.7" font-size="20">Agent session</text>
    <text class="node-subtitle" x="129.6" y="71.5" font-size="16">Follows repo instructions</text>
  </g>
  <g class="node node-amber" transform="translate(770.4 58.5)" filter="url(#shadow)">
    <rect width="259.2" height="93" rx="18" fill="#fff7ed" stroke="#c2410c"/>
    <use href="#icon-pull-request" x="18.79" y="16.5" width="34" height="34" color="#c2410c"/>
    <text class="node-title icon-copy" x="61.11" y="40.7" font-size="20">PR and preview</text>
    <text class="node-subtitle" x="129.6" y="71.5" font-size="16">Running change to inspect</text>
  </g>
  <g class="node node-green" transform="translate(1130.4 58.5)" filter="url(#shadow)">
    <rect width="259.2" height="93" rx="18" fill="#f5fbe7" stroke="#648900"/>
    <use href="#icon-check" x="20.82" y="16.5" width="34" height="34" color="#648900"/>
    <text class="node-title icon-copy" x="63.99" y="40.7" font-size="20">Release checks</text>
    <text class="node-subtitle" x="129.6" y="71.5" font-size="16">End-to-end tests</text>
  </g>
</svg>
