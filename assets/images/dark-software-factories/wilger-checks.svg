<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="450" viewBox="0 0 1440 450" role="img" aria-labelledby="title desc">
  <title id="title">John Wilger&#x27;s checks for agent work</title>
  <desc id="desc">A task is isolated, tested, independently reviewed, and checked on a live URL; a code edit sends it back to testing, and a gate the agents cannot pass goes to Wilger.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#7c3aed"/></marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#2563eb"/></marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#c2410c"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#648900"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#dc2626"/></marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#737373"/></marker>
    <symbol id="icon-browser" viewBox="0 0 32 22">
        <rect x="1" y="1.5" width="30" height="19" rx="2.25" fill="none" stroke="currentColor" stroke-width="2.67"/>
        <path d="M1.5 6.5h29" fill="none" stroke="currentColor" stroke-width="2.67"/>
        <circle cx="4" cy="4" r=".48" fill="currentColor"/>
        <circle cx="6.2" cy="4" r=".48" fill="currentColor"/>
        <circle cx="8.4" cy="4" r=".48" fill="currentColor"/>
        <rect x="12" y="3.3" width="15" height="1.5" rx=".75" fill="currentColor" opacity=".35"/>
      </symbol>
    <symbol id="icon-check" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="m7.5 12 3 3 6-7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </symbol>
    <symbol id="icon-issue" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="M12 7v6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="17" r="1.2" fill="currentColor"/>
      </symbol>
    <symbol id="icon-search" viewBox="0 0 24 24">
        <circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="m16 16 4.5 4.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </symbol>
    <style>
      text { font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #171717; }
      symbol [stroke] { vector-effect: non-scaling-stroke; }
      .node rect { stroke-width: 2; }
      .node-boundary rect { stroke-width: 2; stroke-dasharray: 8 8; }
      .boundary-title { font-size: 16px; font-weight: 750; text-anchor: start; }
      .node-title { font-weight: 750; text-anchor: middle; }
      .node-title.icon-copy { text-anchor: start; }
      .node-subtitle { font-weight: 500; fill: #525252; text-anchor: middle; }
      .eyebrow { font-weight: 750; letter-spacing: 1px; fill: #525252; text-anchor: middle; }
      .mention-icon { font-size: 27px; font-weight: 750; text-anchor: middle; }
      .standalone-mention { font-size: 52px; font-weight: 750; text-anchor: middle; }
      .icon-node-title { font-size: 16px; font-weight: 750; text-anchor: middle; }
      .edge { fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
      .edge-label rect { stroke-width: 2; }
      .edge-label text { font-size: 14px; font-weight: 750; text-anchor: middle; dominant-baseline: central; }
      .divider { stroke: #d4d4d4; stroke-width: 2; stroke-dasharray: 6 8; stroke-linecap: round; }
      .center-annotation { fill: #f5f5f5; stroke: none; }
      .center-title { font-weight: 800; letter-spacing: 0.08em; fill: #404040; text-anchor: middle; }
      .center-detail { font-weight: 600; fill: #525252; text-anchor: middle; }
    </style>
  </defs>
  <rect width="1440" height="450" fill="#ffffff"/>

  <path class="edge" d="M309.6 139.75L410.4 139.75" stroke="#737373" marker-end="url(#arrow-gray)"/>
  <path class="edge" d="M669.6 139.75L770.4 139.75" stroke="#737373" marker-end="url(#arrow-gray)"/>
  <path class="edge" d="M1029.6 139.75L1130.4 139.75" stroke="#737373" marker-end="url(#arrow-gray)"/>
  <path class="edge" d="M900 207.5V346.5H540V212" stroke="#c2410c" marker-end="url(#arrow-amber)"/>
  <g class="edge-label" transform="translate(720 346.5)">
    <rect x="-64.79" y="-16" width="129.57" height="32" rx="16.0" fill="#ffffff" stroke="#c2410c"/>
    <text fill="#c2410c">CODE EDITED</text>
  </g>

  <g class="node node-blue" transform="translate(50.4 87.75)" filter="url(#shadow)">
    <rect width="259.2" height="104" rx="18" fill="#eff6ff" stroke="#2563eb"/>
    <use href="#icon-issue" x="41.04" y="22" width="34" height="34" color="#2563eb"/>
    <text class="node-title icon-copy" x="84.22" y="45.48" font-size="18">Isolated task</text>
    <text class="node-subtitle" x="129.6" y="77" font-size="16">Own worktree</text>
  </g>
  <g class="node node-amber" transform="translate(410.4 87.75)" filter="url(#shadow)">
    <rect width="259.2" height="104" rx="18" fill="#fff7ed" stroke="#c2410c"/>
    <use href="#icon-check" x="16.88" y="22" width="34" height="34" color="#c2410c"/>
    <text class="node-title icon-copy" x="60.06" y="45.48" font-size="18">Test current code</text>
    <text class="node-subtitle" x="129.6" y="77" font-size="16">Evidence for this change</text>
  </g>
  <g class="node node-purple" transform="translate(770.4 87.75)" filter="url(#shadow)">
    <rect width="259.2" height="104" rx="18" fill="#f5f3ff" stroke="#7c3aed"/>
    <use href="#icon-search" x="40.49" y="22" width="34" height="34" color="#7c3aed"/>
    <text class="node-title icon-copy" x="82.82" y="45.48" font-size="18">Fresh review</text>
    <text class="node-subtitle" x="129.6" y="77" font-size="16">Reviewer cannot edit</text>
  </g>
  <g class="node node-green" transform="translate(1130.4 87.75)" filter="url(#shadow)">
    <rect width="259.2" height="104" rx="18" fill="#f5fbe7" stroke="#648900"/>
    <use href="#icon-browser" x="31.96" y="22" width="34" height="34" color="#648900"/>
    <text class="node-title icon-copy" x="77.96" y="45.48" font-size="18">Check live URL</text>
    <text class="node-subtitle" x="129.6" y="77" font-size="16">Confirm it responds</text>
  </g>
</svg>
