<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="770" viewBox="0 0 1440 770" role="img" aria-labelledby="title desc">
  <title id="title">Dan Shapiro&#x27;s five levels of AI-assisted coding</title>
  <desc id="desc">Six stages from level 0 to level 5 climb toward greater agent autonomy and less routine human code review.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#7c3aed"/></marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#2563eb"/></marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#c2410c"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#648900"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#dc2626"/></marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#737373"/></marker>
    <symbol id="icon-document" viewBox="0 0 24 24">
        <path d="M6 2h8l4 4v16H6Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M14 2v5h4M9 12h6M9 16h6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </symbol>
    <symbol id="icon-issue" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="M12 7v6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="17" r="1.2" fill="currentColor"/>
      </symbol>
    <symbol id="icon-search" viewBox="0 0 24 24">
        <circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="m16 16 4.5 4.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </symbol>
    <symbol id="icon-terminal" viewBox="0 0 24 24">
        <rect x="2.5" y="3" width="19" height="18" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/>
        <path d="M3 7.5h18" fill="none" stroke="currentColor" stroke-width="1.8"/>
        <circle cx="5.5" cy="5.25" r=".75" fill="currentColor"/>
        <circle cx="8" cy="5.25" r=".75" fill="currentColor"/>
        <path d="m7 12 3 2.5-3 2.5M12.5 17h4.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </symbol>
    <symbol id="icon-user" viewBox="0 0 24 24">
        <circle cx="12" cy="8" r="4" fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="M4 22c.6-5 3.3-7 8-7s7.4 2 8 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </symbol>
    <symbol id="icon-workflow" viewBox="0 0 24 24">
        <path d="M4 11A8.5 8.5 0 0 1 19.5 8.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        <path d="M19.5 4.5v4h-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M20 13A8.5 8.5 0 0 1 4.5 15.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        <path d="M4.5 19.5v-4h4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </symbol>
    <style>
      text { font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #171717; }
      symbol [stroke] { vector-effect: non-scaling-stroke; }
      .node rect { stroke-width: 2; }
      .node-boundary rect { stroke-width: 2; stroke-dasharray: 8 8; }
      .boundary-title { font-size: 16px; font-weight: 750; text-anchor: start; }
      .node-title { font-weight: 750; text-anchor: middle; }
      .node-title.icon-copy { text-anchor: start; }
      .node-subtitle { font-weight: 500; fill: #525252; text-anchor: middle; }
      .eyebrow { font-weight: 750; letter-spacing: 1px; fill: #525252; text-anchor: middle; }
      .mention-icon { font-size: 27px; font-weight: 750; text-anchor: middle; }
      .standalone-mention { font-size: 52px; font-weight: 750; text-anchor: middle; }
      .icon-node-title { font-size: 16px; font-weight: 750; text-anchor: middle; }
      .edge { fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
      .edge-label rect { stroke-width: 2; }
      .edge-label text { font-size: 14px; font-weight: 750; text-anchor: middle; dominant-baseline: central; }
      .divider { stroke: #d4d4d4; stroke-width: 2; stroke-dasharray: 6 8; stroke-linecap: round; }
      .center-annotation { fill: #f5f5f5; stroke: none; }
      .center-title { font-weight: 800; letter-spacing: 0.08em; fill: #404040; text-anchor: middle; }
      .center-detail { font-weight: 600; fill: #525252; text-anchor: middle; }
    </style>
  </defs>
  <rect width="1440" height="770" fill="#ffffff"/>

  <path class="edge" d="M325 680H420.5Q432.5 680 432.5 668V612" stroke="#737373" marker-end="url(#arrow-gray)"/>
  <path class="edge" d="M540 562H635.5Q647.5 562 647.5 550V494" stroke="#737373" marker-end="url(#arrow-gray)"/>
  <path class="edge" d="M755 444H850.5Q862.5 444 862.5 432V376" stroke="#737373" marker-end="url(#arrow-gray)"/>
  <path class="edge" d="M970 326H1065.5Q1077.5 326 1077.5 314V258" stroke="#737373" marker-end="url(#arrow-gray)"/>
  <path class="edge" d="M1185 208H1280.5Q1292.5 208 1292.5 196V140" stroke="#737373" marker-end="url(#arrow-gray)"/>

  <g class="node node-gray" transform="translate(40 630)" filter="url(#shadow)">
    <rect width="285" height="100" rx="18" fill="#f5f5f5" stroke="#737373"/>
    <use href="#icon-terminal" x="22.26" y="20" width="34" height="34" color="#737373"/>
    <text class="node-title icon-copy" x="64.72" y="42.76" font-size="16">Level 0 · Write code</text>
    <text class="node-subtitle" x="142.5" y="75" font-size="16">AI suggests occasionally</text>
  </g>
  <g class="node node-blue" transform="translate(255 512)" filter="url(#shadow)">
    <rect width="285" height="100" rx="18" fill="#eff6ff" stroke="#2563eb"/>
    <use href="#icon-issue" x="30.64" y="20" width="34" height="34" color="#2563eb"/>
    <text class="node-title icon-copy" x="73.81" y="42.76" font-size="16">Level 1 · Delegate</text>
    <text class="node-subtitle" x="142.5" y="75" font-size="16">Small tasks</text>
  </g>
  <g class="node node-blue" transform="translate(470 394)" filter="url(#shadow)">
    <rect width="285" height="100" rx="18" fill="#eff6ff" stroke="#2563eb"/>
    <use href="#icon-user" x="53.19" y="20" width="34" height="34" color="#2563eb"/>
    <text class="node-title icon-copy" x="94.94" y="42.76" font-size="16">Level 2 · Pair</text>
    <text class="node-subtitle" x="142.5" y="75" font-size="16">Stay in implementation</text>
  </g>
  <g class="node node-purple" transform="translate(685 276)" filter="url(#shadow)">
    <rect width="285" height="100" rx="18" fill="#f5f3ff" stroke="#7c3aed"/>
    <use href="#icon-search" x="38.12" y="20" width="34" height="34" color="#7c3aed"/>
    <text class="node-title icon-copy" x="80.45" y="42.76" font-size="16">Level 3 · Review</text>
    <text class="node-subtitle" x="142.5" y="75" font-size="16">Read agent-written code</text>
  </g>
  <g class="node node-amber" transform="translate(900 158)" filter="url(#shadow)">
    <rect width="285" height="100" rx="18" fill="#fff7ed" stroke="#c2410c"/>
    <use href="#icon-document" x="38.64" y="20" width="34" height="34" color="#c2410c"/>
    <text class="node-title icon-copy" x="77.56" y="42.76" font-size="16">Level 4 · Specify</text>
    <text class="node-subtitle" x="142.5" y="75" font-size="16">Set checks; agents work</text>
  </g>
  <g class="node node-green" transform="translate(1115 40)" filter="url(#shadow)">
    <rect width="285" height="100" rx="18" fill="#f5fbe7" stroke="#648900"/>
    <use href="#icon-workflow" x="18.96" y="20" width="34" height="34" color="#648900"/>
    <text class="node-title icon-copy" x="63.53" y="42.76" font-size="16">Level 5 · Run factory</text>
    <text class="node-subtitle" x="142.5" y="75" font-size="16">No routine code review</text>
  </g>
</svg>
