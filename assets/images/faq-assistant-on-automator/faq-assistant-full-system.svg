<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="490" viewBox="0 0 1220 490" role="img" aria-labelledby="title desc">
  <title id="title">The complete FAQ assistant system</title>
  <desc id="desc">GitHub proposals, Slack discussions, and YouTube sessions become curated FAQ records. The FAQ dataset joins the documentation site and course repository Markdown in a ZeroSearch index deployed with the FAQ assistant Lambda. Slack threads exchange events and replies with Au-Tomator, which exchanges questions and answers with the assistant.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#64748b"/>
    </marker>
    <symbol id="icon-issue" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/>
      <path d="M12 7v6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      <circle cx="12" cy="17" r="1.2" fill="currentColor"/>
    </symbol>
    <symbol id="icon-message" viewBox="0 0 24 24">
      <path d="M4 4h16v12H9l-5 4Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M8 9h8M8 13h5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </symbol>
    <symbol id="icon-video" viewBox="0 0 24 24">
      <rect x="3" y="5" width="18" height="14" rx="3" fill="none" stroke="currentColor" stroke-width="2"/>
      <path d="m10 9 5 3-5 3Z" fill="currentColor"/>
    </symbol>
    <symbol id="icon-document" viewBox="0 0 24 24">
      <path d="M6 2h8l4 4v16H6Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
      <path d="M14 2v5h4M9 12h6M9 16h6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </symbol>
    <symbol id="icon-github" viewBox="0 0 24 24">
      <path fill="currentColor" d="M12 .7a11.5 11.5 0 0 0-3.64 22.41c.58.11.79-.25.79-.56v-2.23c-3.22.7-3.9-1.37-3.9-1.37-.53-1.34-1.29-1.7-1.29-1.7-1.05-.72.08-.71.08-.71 1.17.08 1.78 1.2 1.78 1.2 1.04 1.77 2.72 1.26 3.38.96.1-.75.4-1.26.74-1.55-2.57-.29-5.27-1.28-5.27-5.68 0-1.26.45-2.28 1.19-3.09-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.16 1.18a10.9 10.9 0 0 1 5.76 0c2.2-1.49 3.16-1.18 3.16-1.18.63 1.59.23 2.76.11 3.05.74.81 1.19 1.83 1.19 3.09 0 4.42-2.71 5.38-5.29 5.67.42.36.79 1.06.79 2.14v3.27c0 .31.21.67.8.56A11.5 11.5 0 0 0 12 .7Z"/>
    </symbol>
    <symbol id="icon-settings" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/>
      <path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9 7 7M17 17l2.1 2.1M19.1 4.9 17 7M7 17l-2.1 2.1" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </symbol>
    <symbol id="icon-sparkles" viewBox="0 0 24 24">
      <path d="m12 2 1.4 4.6L18 8l-4.6 1.4L12 14l-1.4-4.6L6 8l4.6-1.4ZM19 14l.8 2.2L22 17l-2.2.8L19 20l-.8-2.2L16 17l2.2-.8ZM5 14l.8 2.2L8 17l-2.2.8L5 20l-.8-2.2L2 17l2.2-.8Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
    </symbol>
    <symbol id="icon-database" viewBox="0 0 24 24">
      <ellipse cx="12" cy="5" rx="8" ry="3" fill="none" stroke="currentColor" stroke-width="2"/>
      <path d="M4 5v7c0 1.66 3.58 3 8 3s8-1.34 8-3V5M4 12v7c0 1.66 3.58 3 8 3s8-1.34 8-3v-7" fill="none" stroke="currentColor" stroke-width="2"/>
    </symbol>
    <style>
      text { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      .label { font-size: 17px; font-weight: 750; text-anchor: middle; }
      .small { font-size: 14px; font-weight: 500; fill: #64748b; text-anchor: middle; }
      .edge-label { font-size: 12px; font-weight: 500; fill: #64748b; text-anchor: middle; }
      .eyebrow { font-size: 12px; font-weight: 800; letter-spacing: 1.1px; fill: #15803d; text-anchor: middle; }
      .mention-icon { font-size: 27px; font-weight: 750; fill: #7c3aed; text-anchor: middle; }
      .connector { fill: none; stroke: #64748b; stroke-width: 2.5; }
      .line { fill: none; stroke: #64748b; stroke-width: 2.5; marker-end: url(#arrow); }
      .exchange { fill: none; stroke: #64748b; stroke-width: 2.5; marker-start: url(#arrow); marker-end: url(#arrow); }
      .source { fill: #eff6ff; stroke: #60a5fa; stroke-width: 2; }
      .conversation { fill: #f5f3ff; stroke: #a78bfa; stroke-width: 2; }
      .process { fill: #fff7ed; stroke: #fb923c; stroke-width: 2; }
      .dataset { fill: #ecfdf5; stroke: #34d399; stroke-width: 2; }
      .lambda { fill: #ecfdf5; stroke: #34d399; stroke-width: 2.5; }
    </style>
  </defs>

  <path class="connector" d="M230 52.5H260V138"/>
  <path class="connector" d="M230 137.5H260V138"/>
  <path class="connector" d="M230 222.5H260V138"/>
  <path class="line" d="M260 138H290"/>
  <path class="line" d="M510 138H530V245H550"/>

  <path class="connector" d="M770 65H800V155"/>
  <path class="connector" d="M770 155H800"/>
  <path class="connector" d="M770 245H800V155"/>
  <path class="line" d="M800 155H960"/>
  <path class="line" d="M1070 205V340"/>

  <path class="exchange" d="M510 400H590"/>
  <text class="edge-label" x="550" y="386">event / reply</text>
  <path class="exchange" d="M810 400H940"/>
  <text class="edge-label" x="875" y="386">question / answer</text>
  <g filter="url(#shadow)">
    <rect class="source" x="30" y="20" width="200" height="65" rx="16"/>
    <use href="#icon-issue" x="45" y="39" width="26" height="26" color="#2563eb"/>
    <text class="label" x="150" y="47">FAQ proposals</text>
    <text class="small" x="150" y="70">GitHub issues</text>
  </g>

  <g filter="url(#shadow)">
    <rect class="conversation" x="30" y="105" width="200" height="65" rx="16"/>
    <use href="#icon-message" x="35" y="124" width="26" height="26" color="#7c3aed"/>
    <text class="label" x="150" y="132">Slack discussions</text>
    <text class="small" x="150" y="155">Course channels</text>
  </g>

  <g filter="url(#shadow)">
    <rect class="conversation" x="30" y="190" width="200" height="65" rx="16"/>
    <use href="#icon-video" x="35" y="209" width="26" height="26" color="#7c3aed"/>
    <text class="label" x="150" y="217">YouTube sessions</text>
    <text class="small" x="150" y="240">Q&amp;A transcripts</text>
  </g>

  <g filter="url(#shadow)">
    <rect class="process" x="290" y="88" width="220" height="100" rx="18"/>
    <use href="#icon-settings" x="306" y="124" width="28" height="28" color="#c2410c"/>
    <text class="label" x="420" y="144">Curate + review</text>
    <text class="small" x="420" y="169">AI assistant + human</text>
  </g>

  <g filter="url(#shadow)">
    <rect class="source" x="550" y="30" width="220" height="70" rx="16"/>
    <use href="#icon-document" x="566" y="51" width="28" height="28" color="#2563eb"/>
    <text class="label" x="665" y="61">Docs website</text>
    <text class="small" x="665" y="84">datatalks.club/docs</text>
  </g>

  <g filter="url(#shadow)">
    <rect class="source" x="550" y="120" width="220" height="70" rx="16"/>
    <use href="#icon-github" x="566" y="141" width="28" height="28" color="#172033"/>
    <text class="label" x="668" y="151">Course repos</text>
    <text class="small" x="668" y="174">Markdown files</text>
  </g>

  <g filter="url(#shadow)">
    <rect class="dataset" x="550" y="210" width="220" height="70" rx="16"/>
    <use href="#icon-document" x="580" y="231" width="28" height="28" color="#15803d"/>
    <text class="label" x="675" y="251">FAQ dataset</text>
  </g>

  <g filter="url(#shadow)">
    <rect class="process" x="960" y="105" width="220" height="100" rx="18"/>
    <use href="#icon-settings" x="1011" y="141" width="28" height="28" color="#c2410c"/>
    <text class="label" x="1092" y="151">Build index</text>
    <text class="small" x="1092" y="176">ZeroSearch in Lambda</text>
  </g>

  <g filter="url(#shadow)">
    <rect class="conversation" x="290" y="350" width="220" height="100" rx="18"/>
    <text class="mention-icon" x="329" y="409">@</text>
    <text class="label" x="415" y="396">Slack thread</text>
    <text class="small" x="415" y="422">mention · :faq: · reply</text>
  </g>

  <g filter="url(#shadow)">
    <rect class="conversation" x="590" y="350" width="220" height="100" rx="18"/>
    <use href="#icon-sparkles" x="636" y="386" width="28" height="28" color="#7c3aed"/>
    <text class="label" x="725" y="396">Au-Tomator</text>
    <text class="small" x="700" y="422">Router + automator Lambdas</text>
  </g>

  <g filter="url(#shadow)">
    <rect class="lambda" x="940" y="340" width="260" height="120" rx="20"/>
    <text class="eyebrow" x="1070" y="369">FAQ ASSISTANT LAMBDA</text>
    <use href="#icon-database" x="974" y="381" width="28" height="28" color="#15803d"/>
    <text class="label" x="1090" y="401">Search + answer</text>
    <text class="small" x="1070" y="431">ZeroSearch index + API</text>
  </g>
</svg>
