<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="330" viewBox="0 0 1250 330" role="img" aria-labelledby="title desc">
  <title id="title">Lambda package size comparison</title>
  <desc id="desc">The AWS Lambda direct-upload ZIP limit is 50 megabytes. The compressed scikit-learn and pandas dependency stack is approximately 75 megabytes. The deployed Zerosearch bot is 8 megabytes.</desc>
  <style>
    text { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
    .heading { font-size: 18px; font-weight: 700; }
    .label { font-size: 17px; font-weight: 700; }
    .sub { font-size: 14px; font-weight: 500; fill: #64748b; }
    .threshold { font-size: 14px; font-weight: 500; fill: #c2410c; }
    .value { font-size: 16px; font-weight: 700; }
    .value-light { font-size: 16px; font-weight: 700; fill: #ffffff; }
    .tick { font-size: 13px; font-weight: 500; fill: #64748b; text-anchor: middle; }
    .track { fill: #f1f5f9; }
  </style>

  <text class="heading" x="30" y="38">Compressed deployment size</text>

  <line x1="860" y1="65" x2="860" y2="275" stroke="#c2410c" stroke-width="2" stroke-dasharray="7 7"/>
  <text class="threshold" x="872" y="78">50 MB direct-upload limit</text>

  <text class="label" x="30" y="120">scikit-learn + pandas</text>
  <text class="sub" x="30" y="143">Includes NumPy and SciPy</text>
  <rect class="track" x="360" y="100" width="800" height="52" rx="12"/>
  <rect x="360" y="100" width="750" height="52" rx="12" fill="#dc2626"/>
  <text class="value-light" x="1042" y="133">75 MB</text>

  <text class="label" x="30" y="220">Zerosearch bot</text>
  <text class="sub" x="30" y="243">Complete deployed package</text>
  <rect class="track" x="360" y="200" width="800" height="52" rx="12"/>
  <rect x="360" y="200" width="80" height="52" rx="12" fill="#15803d"/>
  <text class="value" x="454" y="233">8 MB</text>

  <line x1="360" y1="282" x2="1160" y2="282" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="360" y1="277" x2="360" y2="287" stroke="#94a3b8"/><text class="tick" x="360" y="308">0</text>
  <line x1="610" y1="277" x2="610" y2="287" stroke="#94a3b8"/><text class="tick" x="610" y="308">25</text>
  <line x1="860" y1="277" x2="860" y2="287" stroke="#94a3b8"/><text class="tick" x="860" y="308">50</text>
  <line x1="1110" y1="277" x2="1110" y2="287" stroke="#94a3b8"/><text class="tick" x="1110" y="308">75</text>
  <line x1="1160" y1="277" x2="1160" y2="287" stroke="#94a3b8"/><text class="tick" x="1160" y="308">80 MB</text>
</svg>
