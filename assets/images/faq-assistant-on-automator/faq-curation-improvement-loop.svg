<svg xmlns="http://www.w3.org/2000/svg" width="840" height="800" viewBox="0 0 840 800" role="img" aria-labelledby="title desc">
  <title id="title">Continuous FAQ curation and improvement loop</title>
  <desc id="desc">Students contribute FAQ issues, useful Slack discussions become reviewed records, the dataset is indexed and deployed, Au-Tomator answers questions, and incomplete answers become evaluation cases that guide the next FAQ improvements.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#7c3aed"/></marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#2563eb"/></marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#c2410c"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#15803d"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#dc2626"/></marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#64748b"/></marker>
    <symbol id="icon-database" viewBox="0 0 24 24">
        <ellipse cx="12" cy="5" rx="8" ry="3" fill="none" stroke="currentColor" stroke-width="1.75" vector-effect="non-scaling-stroke"/>
        <path d="M4 5v7c0 1.66 3.58 3 8 3s8-1.34 8-3V5M4 12v7c0 1.66 3.58 3 8 3s8-1.34 8-3v-7" fill="none" stroke="currentColor" stroke-width="1.75" vector-effect="non-scaling-stroke"/>
      </symbol>
    <symbol id="icon-issue" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="M12 7v6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="17" r="1.2" fill="currentColor"/>
      </symbol>
    <symbol id="icon-message" viewBox="0 0 24 24">
        <path d="M4 4h16v12H9l-5 4Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M8 9h8M8 13h5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </symbol>
    <symbol id="icon-warning" viewBox="0 0 24 24">
        <path d="M12 3 2.5 21h19Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M12 9v5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="17.5" r="1.1" fill="currentColor"/>
      </symbol>
    <style>
      text { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      .node rect { stroke-width: 2; }
      .node-title { font-size: 16px; font-weight: 750; text-anchor: middle; }
      .node-title.icon-copy { text-anchor: start; }
      .node-subtitle { font-size: 13px; font-weight: 500; fill: #7a8699; text-anchor: middle; }
      .eyebrow { font-size: 12px; font-weight: 750; letter-spacing: 1px; fill: #64748b; text-anchor: middle; }
      .mention-icon { font-size: 27px; font-weight: 750; text-anchor: middle; }
      .standalone-mention { font-size: 52px; font-weight: 750; text-anchor: middle; }
      .icon-node-title { font-size: 16px; font-weight: 750; text-anchor: middle; }
      .edge { fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
      .edge-label rect { stroke-width: 2; }
      .edge-label text { font-size: 14px; font-weight: 750; text-anchor: middle; dominant-baseline: central; }
      .divider { stroke: #cbd5e1; stroke-width: 2; stroke-dasharray: 6 8; stroke-linecap: round; }
      .center-annotation { fill: #f1f5f9; stroke: none; }
      .center-title { font-weight: 800; letter-spacing: 0.08em; fill: #334155; text-anchor: middle; }
      .center-detail { font-weight: 600; fill: #64748b; text-anchor: middle; }
    </style>
  </defs>
  <rect width="840" height="800" fill="#ffffff"/>

  <path class="edge" d="M534.19 141.22A310.18 310.18 0 0 1 659 231.9" stroke="#64748b" marker-end="url(#arrow-gray)"/>
  <path class="edge" d="M729.57 449.1A310.18 310.18 0 0 1 681.89 595.82" stroke="#64748b" marker-end="url(#arrow-gray)"/>
  <path class="edge" d="M497.14 730.06A310.18 310.18 0 0 1 342.86 730.06" stroke="#64748b" marker-end="url(#arrow-gray)"/>
  <path class="edge" d="M158.11 595.82A310.18 310.18 0 0 1 110.43 449.1" stroke="#64748b" marker-end="url(#arrow-gray)"/>
  <path class="edge" d="M181 231.9A310.18 310.18 0 0 1 305.81 141.22" stroke="#64748b" marker-end="url(#arrow-gray)"/>

  <circle class="center-annotation" cx="420" cy="429.62" r="205"/>
  <text class="center-title" x="420" y="414.79" font-size="44">CURATION</text>
  <text class="center-title" x="420" y="473.79" font-size="44">LOOP</text>
  <text class="center-detail" x="420" y="674.62" font-size="32">Each failure improves the data</text>

  <g class="node node-blue" transform="translate(335 46.94)" filter="url(#shadow)">
    <rect width="170" height="145" rx="18" fill="#eff6ff" stroke="#2563eb"/>
    <use href="#icon-issue" x="16" y="38.5" width="28" height="28" color="#2563eb"/>
    <text class="node-title icon-copy" x="56" y="58.5" textLength="98" lengthAdjust="spacingAndGlyphs">Student contributions</text>
    <text class="node-subtitle" x="85" y="84.5">Issues improve the</text>
    <text class="node-subtitle" x="85" y="102.5">FAQ dataset</text>
  </g>
  <g class="node node-purple" transform="translate(630 261.27)" filter="url(#shadow)">
    <rect width="170" height="145" rx="18" fill="#f5f3ff" stroke="#7c3aed"/>
    <use href="#icon-message" x="16" y="38.5" width="28" height="28" color="#7c3aed"/>
    <text class="node-title icon-copy" x="56" y="58.5" textLength="98" lengthAdjust="spacingAndGlyphs">Curate discussions</text>
    <text class="node-subtitle" x="85" y="84.5">Slack → reviewed</text>
    <text class="node-subtitle" x="85" y="102.5">FAQ records</text>
  </g>
  <g class="node node-green" transform="translate(517.32 608.06)" filter="url(#shadow)">
    <rect width="170" height="145" rx="18" fill="#ecfdf5" stroke="#15803d"/>
    <use href="#icon-database" x="16" y="38.5" width="28" height="28" color="#15803d"/>
    <text class="node-title icon-copy" x="56" y="58.5" textLength="98" lengthAdjust="spacingAndGlyphs">Index + deploy</text>
    <text class="node-subtitle" x="85" y="84.5">Fresh dataset ships</text>
    <text class="node-subtitle" x="85" y="102.5">with Lambda</text>
  </g>
  <g class="node node-purple" transform="translate(152.68 608.06)" filter="url(#shadow)">
    <rect width="170" height="145" rx="18" fill="#f5f3ff" stroke="#7c3aed"/>
    <text class="mention-icon" x="30" y="61.5" fill="#7c3aed">@</text>
    <text class="node-title icon-copy" x="56" y="58.5" textLength="98" lengthAdjust="spacingAndGlyphs">Answer questions</text>
    <text class="node-subtitle" x="85" y="84.5">Au-Tomator</text>
    <text class="node-subtitle" x="85" y="102.5">responds in Slack</text>
  </g>
  <g class="node node-red" transform="translate(40 261.27)" filter="url(#shadow)">
    <rect width="170" height="145" rx="18" fill="#fef2f2" stroke="#dc2626"/>
    <use href="#icon-warning" x="16" y="38.5" width="28" height="28" color="#dc2626"/>
    <text class="node-title icon-copy" x="56" y="58.5" textLength="98" lengthAdjust="spacingAndGlyphs">Evaluate failures</text>
    <text class="node-subtitle" x="85" y="84.5">Missing answers</text>
    <text class="node-subtitle" x="85" y="102.5">reveal next fixes</text>
  </g>
</svg>
