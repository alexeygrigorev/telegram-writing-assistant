<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="230" viewBox="0 0 1120 230" role="img" aria-labelledby="title desc">
  <title id="title">Deploying the FAQ assistant with Au-Tomator</title>
  <desc id="desc">A Slack event passes through the existing Au-Tomator router and automator Lambdas to the new FAQ assistant Lambda. The FAQ assistant returns an answer to the automator, which posts the response to Slack.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#64748b"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#16a34a"/>
    </marker>
    <symbol id="icon-api" viewBox="0 0 24 24">
      <path d="m8 5-5 7 5 7M16 5l5 7-5 7M14 3l-4 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="icon-sparkles" viewBox="0 0 24 24">
      <path d="m12 2 1.4 4.6L18 8l-4.6 1.4L12 14l-1.4-4.6L6 8l4.6-1.4ZM19 14l.8 2.2L22 17l-2.2.8L19 20l-.8-2.2L16 17l2.2-.8ZM5 14l.8 2.2L8 17l-2.2.8L5 20l-.8-2.2L2 17l2.2-.8Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
    </symbol>
    <symbol id="icon-search" viewBox="0 0 24 24">
      <circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/>
      <path d="m16 16 4.5 4.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </symbol>
    <style>
      text { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      .eyebrow { font-size: 12px; font-weight: 800; letter-spacing: 1.1px; text-anchor: middle; }
      .label { font-size: 17px; font-weight: 750; text-anchor: middle; }
      .icon-copy { text-anchor: start; }
      .mention-icon { font-size: 27px; font-weight: 750; fill: #7c3aed; text-anchor: middle; }
      .small { font-size: 14px; font-weight: 500; fill: #64748b; text-anchor: middle; }
      .request { fill: none; stroke: #64748b; stroke-width: 2.5; marker-end: url(#arrow); }
      .response { fill: none; stroke: #16a34a; stroke-width: 2.5; marker-end: url(#arrow-green); }
      .slack { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 2; }
      .lambda { fill: #fff; stroke: #7c3aed; stroke-width: 2; }
      .assistant { fill: #ecfdf5; stroke: #15803d; stroke-width: 2; }
    </style>
  </defs>

  <path class="request" d="M250 90H310"/>
  <path class="request" d="M530 90H590"/>
  <path class="request" d="M810 90H870"/>

  <path class="response" d="M980 150V200H730V150"/>
  <text class="small" x="855" y="191" fill="#15803d">answer</text>
  <path class="response" d="M670 150V200H140V150"/>
  <text class="small" x="405" y="191" fill="#15803d">post response</text>

  <g class="node node-endpoint node-with-icon" transform="translate(30 30)" filter="url(#shadow)">
    <rect class="slack" width="220" height="120" rx="20"/>
    <text class="mention-icon" x="30" y="64">@</text>
    <text class="label icon-copy" x="56" y="61">Slack mention</text>
    <text class="small" x="110" y="91">mention or :faq: reaction</text>
  </g>

  <g class="node node-endpoint node-with-icon" transform="translate(310 30)" filter="url(#shadow)">
    <rect class="lambda" width="220" height="120" rx="20"/>
    <text class="eyebrow" x="110" y="29" fill="#7c3aed">LAMBDA</text>
    <use href="#icon-api" x="16" y="41" width="28" height="28" color="#7c3aed"/>
    <text class="label icon-copy" x="56" y="61">Router</text>
    <text class="small" x="110" y="91">Filter + acknowledge</text>
  </g>

  <g class="node node-endpoint node-with-icon" transform="translate(590 30)" filter="url(#shadow)">
    <rect class="lambda" width="220" height="120" rx="20"/>
    <text class="eyebrow" x="110" y="29" fill="#7c3aed">LAMBDA</text>
    <use href="#icon-sparkles" x="16" y="41" width="28" height="28" color="#7c3aed"/>
    <text class="label icon-copy" x="56" y="61">Automator</text>
    <text class="small" x="110" y="91">Orchestrate events</text>
  </g>

  <g class="node node-endpoint node-with-icon" transform="translate(870 30)" filter="url(#shadow)">
    <rect class="assistant" width="220" height="120" rx="20"/>
    <text class="eyebrow" x="110" y="29" fill="#15803d">NEW LAMBDA</text>
    <use href="#icon-search" x="16" y="41" width="28" height="28" color="#15803d"/>
    <text class="label icon-copy" x="56" y="61">FAQ assistant</text>
    <text class="small" x="110" y="91">Search + generate</text>
  </g>
</svg>
