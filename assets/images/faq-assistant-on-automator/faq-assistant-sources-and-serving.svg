<svg xmlns="http://www.w3.org/2000/svg" width="840" height="455" viewBox="0 0 840 455" role="img" aria-labelledby="title desc">
  <title id="title">FAQ assistant sources and Slack serving flow</title>
  <desc id="desc">The FAQ dataset, DataTalks.Club documentation, and Markdown files from course repositories feed one search index packaged in the FAQ assistant Lambda. A Slack mention or FAQ reaction triggers Au-Tomator, which exchanges the question and answer with that Lambda.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#64748b"/>
    </marker>
    <symbol id="icon-document" viewBox="0 0 24 24">
      <path d="M6 2h8l4 4v16H6Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
      <path d="M14 2v5h4M9 12h6M9 16h6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </symbol>
    <symbol id="icon-github" viewBox="0 0 24 24">
      <path fill="currentColor" d="M12 .7a11.5 11.5 0 0 0-3.64 22.41c.58.11.79-.25.79-.56v-2.23c-3.22.7-3.9-1.37-3.9-1.37-.53-1.34-1.29-1.7-1.29-1.7-1.05-.72.08-.71.08-.71 1.17.08 1.78 1.2 1.78 1.2 1.04 1.77 2.72 1.26 3.38.96.1-.75.4-1.26.74-1.55-2.57-.29-5.27-1.28-5.27-5.68 0-1.26.45-2.28 1.19-3.09-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.16 1.18a10.9 10.9 0 0 1 5.76 0c2.2-1.49 3.16-1.18 3.16-1.18.63 1.59.23 2.76.11 3.05.74.81 1.19 1.83 1.19 3.09 0 4.42-2.71 5.38-5.29 5.67.42.36.79 1.06.79 2.14v3.27c0 .31.21.67.8.56A11.5 11.5 0 0 0 12 .7Z"/>
    </symbol>
    <symbol id="icon-settings" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/>
      <path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9 7 7M17 17l2.1 2.1M19.1 4.9 17 7M7 17l-2.1 2.1" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </symbol>
    <symbol id="icon-sparkles" viewBox="0 0 24 24">
      <path d="m12 2 1.4 4.6L18 8l-4.6 1.4L12 14l-1.4-4.6L6 8l4.6-1.4ZM19 14l.8 2.2L22 17l-2.2.8L19 20l-.8-2.2L16 17l2.2-.8ZM5 14l.8 2.2L8 17l-2.2.8L5 20l-.8-2.2L2 17l2.2-.8Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
    </symbol>
    <symbol id="icon-database" viewBox="0 0 24 24">
      <ellipse cx="12" cy="5" rx="8" ry="3" fill="none" stroke="currentColor" stroke-width="2"/>
      <path d="M4 5v7c0 1.66 3.58 3 8 3s8-1.34 8-3V5M4 12v7c0 1.66 3.58 3 8 3s8-1.34 8-3v-7" fill="none" stroke="currentColor" stroke-width="2"/>
    </symbol>
    <style>
      text { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      .label { font-size: 17px; font-weight: 750; text-anchor: middle; }
      .small { font-size: 14px; font-weight: 500; fill: #64748b; text-anchor: middle; }
      .icon-copy { text-anchor: start; }
      .node-compact .label { font-size: 16px; }
      .eyebrow { font-size: 12px; font-weight: 800; letter-spacing: 1.1px; fill: #15803d; text-anchor: middle; }
      .mention-icon { font-size: 27px; font-weight: 750; fill: #7c3aed; text-anchor: middle; }
      .connector { fill: none; stroke: #64748b; stroke-width: 2.5; }
      .line { fill: none; stroke: #64748b; stroke-width: 2.5; marker-end: url(#arrow); }
      .exchange { fill: none; stroke: #64748b; stroke-width: 2.5; marker-start: url(#arrow); marker-end: url(#arrow); }
      .source { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; }
      .dataset { fill: #ecfdf5; stroke: #15803d; stroke-width: 2; }
      .process { fill: #fff7ed; stroke: #c2410c; stroke-width: 2; }
      .slack { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 2; }
      .lambda { fill: #ecfdf5; stroke: #15803d; stroke-width: 2; }
    </style>
  </defs>

  <path class="connector" d="M250 52.5H280V138"/>
  <path class="connector" d="M250 137.5H280V138"/>
  <path class="connector" d="M250 222.5H280V138"/>
  <path class="line" d="M280 138H310"/>
  <path class="line" d="M530 138H700V315"/>

  <path class="exchange" d="M250 375H310"/>
  <path class="exchange" d="M530 375H590"/>

  <g class="node node-compact node-with-icon" transform="translate(30 20)" filter="url(#shadow)">
    <rect class="dataset" width="220" height="65" rx="16"/>
    <use href="#icon-database" x="16" y="19" width="26" height="26" color="#15803d"/>
    <text class="label icon-copy" x="54" y="27">FAQ dataset</text>
    <text class="small icon-copy" x="54" y="50">Curated Markdown</text>
  </g>

  <g class="node node-compact node-with-icon" transform="translate(30 105)" filter="url(#shadow)">
    <rect class="source" width="220" height="65" rx="16"/>
    <use href="#icon-document" x="16" y="19" width="26" height="26" color="#2563eb"/>
    <text class="label icon-copy" x="54" y="27">Docs website</text>
    <text class="small icon-copy" x="54" y="50">datatalks.club/docs</text>
  </g>

  <g class="node node-compact node-with-icon" transform="translate(30 190)" filter="url(#shadow)">
    <rect class="source" width="220" height="65" rx="16"/>
    <use href="#icon-github" x="16" y="19" width="26" height="26" color="#172033"/>
    <text class="label icon-copy" x="54" y="27">Course repos</text>
    <text class="small icon-copy" x="54" y="50">Markdown files</text>
  </g>

  <g class="node node-action node-with-icon" transform="translate(310 88)" filter="url(#shadow)">
    <rect class="process" width="220" height="100" rx="18"/>
    <use href="#icon-settings" x="16" y="36" width="28" height="28" color="#c2410c"/>
    <text class="label icon-copy" x="56" y="56">Build index</text>
    <text class="small" x="110" y="81">Create ZeroSearch index</text>
  </g>

  <g class="node node-action node-with-icon" transform="translate(30 325)" filter="url(#shadow)">
    <rect class="slack" width="220" height="100" rx="18"/>
    <text class="mention-icon" x="30" y="59">@</text>
    <text class="label icon-copy" x="56" y="56">Slack trigger</text>
    <text class="small" x="110" y="81">mention · :faq: · response</text>
  </g>

  <g class="node node-action node-with-icon" transform="translate(310 325)" filter="url(#shadow)">
    <rect class="slack" width="220" height="100" rx="18"/>
    <use href="#icon-sparkles" x="16" y="36" width="28" height="28" color="#7c3aed"/>
    <text class="label icon-copy" x="56" y="56">Au-Tomator</text>
    <text class="small" x="110" y="81">Route event + post reply</text>
  </g>

  <g class="node node-endpoint node-with-icon" transform="translate(590 315)" filter="url(#shadow)">
    <rect class="lambda" width="220" height="120" rx="20"/>
    <text class="eyebrow" x="110" y="29">FAQ ASSISTANT LAMBDA</text>
    <use href="#icon-database" x="16" y="41" width="28" height="28" color="#15803d"/>
    <text class="label icon-copy" x="56" y="61">FAQ assistant</text>
    <text class="small" x="110" y="91">Search index + answer API</text>
  </g>
</svg>
