<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="430" viewBox="0 0 1250 430" role="img" aria-labelledby="title desc">
  <title id="title">Leave-one-out evaluation</title>
  <desc id="desc">Remove record D from the current 200-record FAQ dataset. Run the held-out issue D through the FAQ workflow using the remaining 199 records to recover the expected NEW decision.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#64748b"/>
    </marker>
    <symbol id="icon-database" viewBox="0 0 24 24">
      <ellipse cx="12" cy="5" rx="8" ry="3" fill="none" stroke="currentColor" stroke-width="2"/>
      <path d="M4 5v7c0 1.66 3.58 3 8 3s8-1.34 8-3V5M4 12v7c0 1.66 3.58 3 8 3s8-1.34 8-3v-7" fill="none" stroke="currentColor" stroke-width="2"/>
    </symbol>
    <symbol id="icon-document" viewBox="0 0 24 24">
      <path d="M6 2h8l4 4v16H6Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
      <path d="M14 2v5h4M9 12h6M9 16h6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </symbol>
    <symbol id="icon-settings" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/>
      <path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9 7 7M17 17l2.1 2.1M19.1 4.9 17 7M7 17l-2.1 2.1" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </symbol>
    <symbol id="icon-check" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/>
      <path d="m7.5 12 3 3 6-7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <style>
      text { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; text-anchor: middle; }
      .label { font-size: 18px; font-weight: 700; }
      .small { font-size: 15px; font-weight: 600; }
      .tiny { font-size: 13px; font-weight: 600; }
      .muted { font-size: 14px; font-weight: 500; fill: #64748b; }
      .line { fill: none; stroke: #64748b; stroke-width: 2.5; marker-end: url(#arrow); }
      .dashed { fill: none; stroke: #94a3b8; stroke-width: 2.5; stroke-dasharray: 7 7; }
      .box { fill: #eff6ff; stroke: #60a5fa; stroke-width: 2; }
      .test { fill: #f5f3ff; stroke: #a78bfa; stroke-width: 2; }
      .workflow { fill: #fff7ed; stroke: #fb923c; stroke-width: 2; }
      .result { fill: #ecfdf5; stroke: #34d399; stroke-width: 2; }
      .record { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; }
      .removed { fill: #fff1f2; stroke: #fb7185; stroke-width: 2; }
    </style>
  </defs>

  <path class="line" d="M460 105H620"/>
  <text class="muted" x="540" y="85">Remove D</text>
  <path class="line" d="M500 325H650"/>
  <path class="line" d="M870 325H1010"/>
  <path class="dashed" d="M760 275V175"/>
  <text class="muted" x="795" y="230">uses</text>

  <rect class="box" x="60" y="35" width="400" height="140" rx="16"/>
  <use href="#icon-database" x="87" y="57" width="30" height="30" color="#172033"/>
  <text class="label" x="277" y="78">Current FAQ dataset</text>
  <text class="muted" x="260" y="158">200 records</text>
  <rect class="record" x="90" y="98" width="42" height="36" rx="8"/><text class="small" x="111" y="122">A</text>
  <rect class="record" x="142" y="98" width="42" height="36" rx="8"/><text class="small" x="163" y="122">B</text>
  <rect class="record" x="194" y="98" width="42" height="36" rx="8"/><text class="small" x="215" y="122">C</text>
  <rect class="removed" x="246" y="98" width="42" height="36" rx="8"/><text class="small" x="267" y="122">D</text>
  <rect class="record" x="298" y="98" width="70" height="36" rx="8"/><text class="small" x="333" y="122">…</text>

  <rect class="box" x="620" y="35" width="400" height="140" rx="16"/>
  <use href="#icon-database" x="647" y="57" width="30" height="30" color="#172033"/>
  <text class="label" x="837" y="78">Dataset without D</text>
  <text class="muted" x="820" y="158">199 records</text>
  <rect class="record" x="668" y="98" width="42" height="36" rx="8"/><text class="small" x="689" y="122">A</text>
  <rect class="record" x="720" y="98" width="42" height="36" rx="8"/><text class="small" x="741" y="122">B</text>
  <rect class="record" x="772" y="98" width="42" height="36" rx="8"/><text class="small" x="793" y="122">C</text>
  <rect class="record" x="824" y="98" width="70" height="36" rx="8"/><text class="small" x="859" y="122">…</text>

  <rect class="test" x="310" y="275" width="190" height="100" rx="16"/>
  <use href="#icon-document" x="329" y="293" width="24" height="24" color="#172033"/>
  <text class="small" x="423" y="310">Held-out issue</text>
  <rect class="removed" x="384" y="325" width="42" height="36" rx="8"/>
  <text class="small" x="405" y="349">D</text>

  <rect class="workflow" x="650" y="275" width="220" height="100" rx="16"/>
  <use href="#icon-settings" x="673" y="308" width="32" height="32" color="#9a3412"/>
  <text class="label" x="793" y="318">FAQ workflow</text>
  <text class="muted" x="785" y="347">Run the evaluation</text>

  <rect class="result" x="1010" y="275" width="190" height="100" rx="16"/>
  <use href="#icon-check" x="1035" y="308" width="34" height="34" color="#15803d"/>
  <text class="label" x="1130" y="335">NEW</text>
</svg>
