<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="405" viewBox="0 0 1140 405" role="img" aria-labelledby="title desc">
  <title id="title">Leave-one-out evaluation</title>
  <desc id="desc">Remove record D from the current 200-record FAQ dataset. Run the held-out issue D through the FAQ workflow using the remaining 199 records to recover the expected NEW decision.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#64748b"/>
    </marker>
    <symbol id="icon-database" viewBox="0 0 24 24">
      <ellipse cx="12" cy="5" rx="8" ry="3" fill="none" stroke="currentColor" stroke-width="2"/>
      <path d="M4 5v7c0 1.66 3.58 3 8 3s8-1.34 8-3V5M4 12v7c0 1.66 3.58 3 8 3s8-1.34 8-3v-7" fill="none" stroke="currentColor" stroke-width="2"/>
    </symbol>
    <symbol id="icon-document" viewBox="0 0 24 24">
      <path d="M6 2h8l4 4v16H6Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
      <path d="M14 2v5h4M9 12h6M9 16h6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </symbol>
    <symbol id="icon-settings" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/>
      <path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9 7 7M17 17l2.1 2.1M19.1 4.9 17 7M7 17l-2.1 2.1" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </symbol>
    <symbol id="icon-check" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/>
      <path d="m7.5 12 3 3 6-7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <style>
      text { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; text-anchor: middle; }
      .label { font-size: 18px; font-weight: 700; }
      .small { font-size: 15px; font-weight: 600; }
      .tiny { font-size: 13px; font-weight: 600; }
      .muted { font-size: 14px; font-weight: 500; fill: #64748b; }
      .icon-copy { text-anchor: start; }
      .line { fill: none; stroke: #64748b; stroke-width: 2.5; marker-end: url(#arrow); }
      .dashed { fill: none; stroke: #94a3b8; stroke-width: 2.5; stroke-dasharray: 7 7; }
      .box { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; }
      .test { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 2; }
      .workflow { fill: #fff7ed; stroke: #c2410c; stroke-width: 2; }
      .result { fill: #ecfdf5; stroke: #15803d; stroke-width: 2; }
      .record { fill: #ffffff; stroke: #94a3b8; stroke-width: 2; }
      .removed { fill: #fef2f2; stroke: #dc2626; stroke-width: 2; }
    </style>
  </defs>

  <path class="line" d="M530 102.5H610"/>
  <text class="muted" x="570" y="86">Remove D</text>
  <path class="line" d="M400 325H460"/>
  <path class="line" d="M680 325H740"/>
  <path class="dashed" d="M860 175V225H570V275"/>
  <text class="muted" x="715" y="215">uses</text>

  <g class="node node-dataset node-with-icon" transform="translate(30 30)" filter="url(#shadow)">
    <rect class="box" width="500" height="145" rx="18"/>
    <use href="#icon-database" x="16" y="22" width="28" height="28" color="#2563eb"/>
    <text class="label icon-copy" x="56" y="43">Current FAQ dataset</text>
    <rect class="record" x="111" y="65" width="42" height="36" rx="8"/><text class="small" x="132" y="89">A</text>
    <rect class="record" x="163" y="65" width="42" height="36" rx="8"/><text class="small" x="184" y="89">B</text>
    <rect class="record" x="215" y="65" width="42" height="36" rx="8"/><text class="small" x="236" y="89">C</text>
    <rect class="removed" x="267" y="65" width="42" height="36" rx="8"/><text class="small" x="288" y="89">D</text>
    <rect class="record" x="319" y="65" width="70" height="36" rx="8"/><text class="small" x="354" y="89">…</text>
    <text class="muted" x="250" y="130">200 records</text>
  </g>

  <g class="node node-dataset node-with-icon" transform="translate(610 30)" filter="url(#shadow)">
    <rect class="box" width="500" height="145" rx="18"/>
    <use href="#icon-database" x="16" y="22" width="28" height="28" color="#2563eb"/>
    <text class="label icon-copy" x="56" y="43">Dataset without D</text>
    <rect class="record" x="137" y="65" width="42" height="36" rx="8"/><text class="small" x="158" y="89">A</text>
    <rect class="record" x="189" y="65" width="42" height="36" rx="8"/><text class="small" x="210" y="89">B</text>
    <rect class="record" x="241" y="65" width="42" height="36" rx="8"/><text class="small" x="262" y="89">C</text>
    <rect class="record" x="293" y="65" width="70" height="36" rx="8"/><text class="small" x="328" y="89">…</text>
    <text class="muted" x="250" y="130">199 records</text>
  </g>

  <g class="node node-action node-with-icon" transform="translate(180 275)" filter="url(#shadow)">
    <rect class="test" width="220" height="100" rx="18"/>
    <use href="#icon-document" x="16" y="16" width="28" height="28" color="#7c3aed"/>
    <text class="small icon-copy" x="56" y="37">Held-out issue</text>
    <rect class="removed" x="89" y="55" width="42" height="36" rx="8"/>
    <text class="small" x="110" y="79">D</text>
  </g>

  <g class="node node-action node-with-icon" transform="translate(460 275)" filter="url(#shadow)">
    <rect class="workflow" width="220" height="100" rx="18"/>
    <use href="#icon-settings" x="16" y="36" width="28" height="28" color="#c2410c"/>
    <text class="label icon-copy" x="56" y="56">FAQ workflow</text>
    <text class="muted" x="110" y="81">Run the evaluation</text>
  </g>

  <g class="node node-action node-with-icon" transform="translate(740 275)" filter="url(#shadow)">
    <rect class="result" width="220" height="100" rx="18"/>
    <use href="#icon-check" x="16" y="36" width="28" height="28" color="#15803d"/>
    <text class="label icon-copy" x="56" y="56">NEW</text>
    <text class="muted" x="110" y="81">Expected decision</text>
  </g>
</svg>
