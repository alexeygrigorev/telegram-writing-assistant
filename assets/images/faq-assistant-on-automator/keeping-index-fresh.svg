<svg xmlns="http://www.w3.org/2000/svg" width="840" height="330" viewBox="0 0 840 330" role="img" aria-labelledby="title desc">
  <title id="title">Keeping the FAQ index fresh</title>
  <desc id="desc">A change to the FAQ and documentation triggers an index rebuild, and the new index is sent to AWS Lambda. A Slack user exchanges questions and replies with the same Lambda.</desc>
  <defs>
    <linearGradient id="lambda-fill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ecfdf5"/>
      <stop offset="1" stop-color="#d1fae5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.09"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#64748b"/>
    </marker>
    <symbol id="icon-settings" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/>
      <path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9 7 7M17 17l2.1 2.1M19.1 4.9 17 7M7 17l-2.1 2.1" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </symbol>
    <symbol id="icon-document" viewBox="0 0 24 24">
      <path d="M6 2h8l4 4v16H6Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
      <path d="M14 2v5h4M9 12h6M9 16h6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </symbol>
    <symbol id="icon-user" viewBox="0 0 24 24">
      <circle cx="12" cy="8" r="4" fill="none" stroke="currentColor" stroke-width="2"/>
      <path d="M4 22c.6-5 3.3-7 8-7s7.4 2 8 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </symbol>
    <symbol id="icon-database" viewBox="0 0 24 24">
      <ellipse cx="12" cy="5" rx="8" ry="3" fill="none" stroke="currentColor" stroke-width="2"/>
      <path d="M4 5v7c0 1.66 3.58 3 8 3s8-1.34 8-3V5M4 12v7c0 1.66 3.58 3 8 3s8-1.34 8-3v-7" fill="none" stroke="currentColor" stroke-width="2"/>
    </symbol>
    <style>
      text { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      .label { font-size: 17px; font-weight: 750; text-anchor: middle; }
      .small { font-size: 14px; font-weight: 500; fill: #64748b; text-anchor: middle; }
      .icon-copy { text-anchor: start; }
      .eyebrow { font-size: 12px; font-weight: 800; letter-spacing: 1.3px; fill: #15803d; text-anchor: middle; }
      .line { fill: none; stroke: #64748b; stroke-width: 2.5; marker-end: url(#arrow); }
      .exchange { fill: none; stroke: #64748b; stroke-width: 2.5; marker-start: url(#arrow); marker-end: url(#arrow); }
      .source { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; }
      .process { fill: #fff7ed; stroke: #c2410c; stroke-width: 2; }
      .user { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 2; }
      .lambda { fill: url(#lambda-fill); stroke: #15803d; stroke-width: 2; }
    </style>
  </defs>

  <path class="line" d="M250 80H310"/>
  <path class="line" d="M530 80H700V185"/>
  <path class="exchange" d="M530 250H590"/>

  <g class="node node-action node-with-icon" transform="translate(30 30)" filter="url(#shadow)">
    <rect class="source" width="220" height="100" rx="18"/>
    <use href="#icon-document" x="16" y="36" width="28" height="28" color="#2563eb"/>
    <text class="label icon-copy" x="56" y="56">FAQ + docs</text>
    <text class="small" x="110" y="81">Change pushed to main</text>
  </g>

  <g class="node node-action node-with-icon" transform="translate(310 30)" filter="url(#shadow)">
    <rect class="process" width="220" height="100" rx="18"/>
    <use href="#icon-settings" x="16" y="36" width="28" height="28" color="#c2410c"/>
    <text class="label icon-copy" x="56" y="56">Rebuild index</text>
    <text class="small" x="110" y="81">Create the new index</text>
  </g>

  <g class="node node-action node-with-icon" transform="translate(310 200)" filter="url(#shadow)">
    <rect class="user" width="220" height="100" rx="18"/>
    <use href="#icon-user" x="16" y="36" width="28" height="28" color="#7c3aed"/>
    <text class="label icon-copy" x="56" y="56">Slack user</text>
    <text class="small" x="110" y="81">Ask + receive reply</text>
  </g>

  <g class="node node-endpoint node-with-icon" transform="translate(590 185)" filter="url(#shadow)">
    <rect class="lambda" width="220" height="120" rx="20"/>
    <text class="eyebrow" x="110" y="29">AWS LAMBDA</text>
    <use href="#icon-database" x="16" y="41" width="28" height="28" color="#15803d"/>
    <text class="label icon-copy" x="56" y="61">Fresh FAQ index</text>
    <text class="small" x="110" y="91">Fresh index · Slack Q&amp;A</text>
  </g>
</svg>
