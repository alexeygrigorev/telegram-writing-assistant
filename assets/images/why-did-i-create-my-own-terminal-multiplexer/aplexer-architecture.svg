<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="530" viewBox="0 0 1440 530" role="img" aria-labelledby="title desc">
  <title id="title">How aplexer separates sessions</title>
  <desc id="desc">aplexer routes one client into independent session workers, so each worker owns one PTY and optional workload cgroup and one session can fail without taking the others with it.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#7c3aed"/></marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#2563eb"/></marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#c2410c"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#15803d"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#dc2626"/></marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#64748b"/></marker>
    <symbol id="icon-container" viewBox="0 0 24 24">
        <rect x="2" y="5" width="20" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="M7 5v14M12 5v14M17 5v14" fill="none" stroke="currentColor" stroke-width="2"/>
      </symbol>
    <symbol id="icon-robot" viewBox="0 0 24 24">
        <path d="M12 5V2.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        <circle cx="12" cy="2.5" r="1" fill="currentColor"/>
        <rect x="4" y="5" width="16" height="15" rx="3" fill="none" stroke="currentColor" stroke-width="1.8"/>
        <path d="M4 10H2.5v5H4M20 10h1.5v5H20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="9" cy="11" r="1.3" fill="currentColor"/>
        <circle cx="15" cy="11" r="1.3" fill="currentColor"/>
        <path d="M8.5 16h7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </symbol>
    <symbol id="icon-workflow" viewBox="0 0 24 24">
        <path d="M4 11A8.5 8.5 0 0 1 19.5 8.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        <path d="M19.5 4.5v4h-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M20 13A8.5 8.5 0 0 1 4.5 15.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        <path d="M4.5 19.5v-4h4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </symbol>
    <style>
      text { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      symbol [stroke] { vector-effect: non-scaling-stroke; }
      .node rect { stroke-width: 2; }
      .node-boundary rect { stroke-width: 2; stroke-dasharray: 8 8; }
      .boundary-title { font-size: 16px; font-weight: 750; text-anchor: start; }
      .node-title { font-weight: 750; text-anchor: middle; }
      .node-title.icon-copy { text-anchor: start; }
      .node-subtitle { font-weight: 500; fill: #475569; text-anchor: middle; }
      .eyebrow { font-weight: 750; letter-spacing: 1px; fill: #475569; text-anchor: middle; }
      .mention-icon { font-size: 27px; font-weight: 750; text-anchor: middle; }
      .standalone-mention { font-size: 52px; font-weight: 750; text-anchor: middle; }
      .icon-node-title { font-size: 16px; font-weight: 750; text-anchor: middle; }
      .edge { fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
      .edge-label rect { stroke-width: 2; }
      .edge-label text { font-size: 14px; font-weight: 750; text-anchor: middle; dominant-baseline: central; }
      .divider { stroke: #cbd5e1; stroke-width: 2; stroke-dasharray: 6 8; stroke-linecap: round; }
      .center-annotation { fill: #f1f5f9; stroke: none; }
      .center-title { font-weight: 800; letter-spacing: 0.08em; fill: #334155; text-anchor: middle; }
      .center-detail { font-weight: 600; fill: #475569; text-anchor: middle; }
    </style>
  </defs>
  <rect width="1440" height="530" fill="#ffffff"/>

  <g class="node-boundary node-blue" transform="translate(80 180)">
    <rect width="340" height="310" rx="22" fill="none" stroke="#2563eb"/>
    <text class="boundary-title" x="20" y="31">Session A</text>
  </g>
  <g class="node-boundary node-blue" transform="translate(550 180)">
    <rect width="340" height="310" rx="22" fill="none" stroke="#2563eb"/>
    <text class="boundary-title" x="20" y="31">Session B</text>
  </g>
  <g class="node-boundary node-blue" transform="translate(1020 180)">
    <rect width="340" height="310" rx="22" fill="none" stroke="#2563eb"/>
    <text class="boundary-title" x="20" y="31">Session C</text>
  </g>
  <path class="edge-boundary-halo" d="M720 111V178H250V245" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="edge" d="M720 111V178H250V245" stroke="#64748b" marker-end="url(#arrow-gray)"/>
  <path class="edge-boundary-halo" d="M720 111L720 245" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="edge" d="M720 111L720 245" stroke="#64748b" marker-end="url(#arrow-gray)"/>
  <path class="edge-boundary-halo" d="M720 111V178H1190V245" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="edge" d="M720 111V178H1190V245" stroke="#64748b" marker-end="url(#arrow-gray)"/>
  <path class="edge" d="M250 331L250 365" stroke="#64748b" marker-end="url(#arrow-gray)"/>
  <path class="edge" d="M720 331L720 365" stroke="#dc2626" marker-end="url(#arrow-red)"/>
  <path class="edge" d="M1190 331L1190 365" stroke="#64748b" marker-end="url(#arrow-gray)"/>

  <g class="node node-purple" transform="translate(610 25)" filter="url(#shadow)">
    <rect width="220" height="86" rx="18" fill="#f5f3ff" stroke="#7c3aed"/>
    <use href="#icon-workflow" x="16" y="13" width="34" height="34" color="#7c3aed"/>
    <text class="node-title icon-copy" x="62" y="35.04" font-size="14">a / Python client</text>
    <text class="node-subtitle" x="110" y="68" font-size="16">lookup + control</text>
  </g>
  <g class="node node-blue" transform="translate(140 245)" filter="url(#shadow)">
    <rect width="220" height="86" rx="18" fill="#eff6ff" stroke="#2563eb"/>
    <use href="#icon-container" x="16" y="2" width="34" height="34" color="#2563eb"/>
    <text class="node-title icon-copy" x="62" y="24.04" font-size="14">Session worker A</text>
    <text class="node-subtitle" x="110" y="57" font-size="16">private socket · PTY ·</text>
    <text class="node-subtitle" x="110" y="79" font-size="16">lifecycle</text>
  </g>
  <g class="node node-blue" transform="translate(140 365)" filter="url(#shadow)">
    <rect width="220" height="86" rx="18" fill="#eff6ff" stroke="#2563eb"/>
    <use href="#icon-robot" x="16" y="2" width="34" height="34" color="#2563eb"/>
    <text class="node-title icon-copy" x="62" y="24.04" font-size="14">Workload A</text>
    <text class="node-subtitle" x="110" y="57" font-size="16">agent or shell ·</text>
    <text class="node-subtitle" x="110" y="79" font-size="16">optional cgroup</text>
  </g>
  <g class="node node-red" transform="translate(610 245)" filter="url(#shadow)">
    <rect width="220" height="86" rx="18" fill="#fef2f2" stroke="#dc2626"/>
    <use href="#icon-container" x="16" y="2" width="34" height="34" color="#dc2626"/>
    <text class="node-title icon-copy" x="62" y="24.04" font-size="14">Session worker B</text>
    <text class="node-subtitle" x="110" y="57" font-size="16">private socket · PTY ·</text>
    <text class="node-subtitle" x="110" y="79" font-size="16">lifecycle</text>
  </g>
  <g class="node node-red" transform="translate(610 365)" filter="url(#shadow)">
    <rect width="220" height="86" rx="18" fill="#fef2f2" stroke="#dc2626"/>
    <use href="#icon-robot" x="16" y="2" width="34" height="34" color="#dc2626"/>
    <text class="node-title icon-copy" x="62" y="24.04" font-size="14">Workload B</text>
    <text class="node-subtitle" x="110" y="57" font-size="16">agent or shell · can</text>
    <text class="node-subtitle" x="110" y="79" font-size="16">OOM</text>
  </g>
  <g class="node node-green" transform="translate(1080 245)" filter="url(#shadow)">
    <rect width="220" height="86" rx="18" fill="#ecfdf5" stroke="#15803d"/>
    <use href="#icon-container" x="16" y="2" width="34" height="34" color="#15803d"/>
    <text class="node-title icon-copy" x="62" y="24.04" font-size="14">Session worker C</text>
    <text class="node-subtitle" x="110" y="57" font-size="16">private socket · PTY ·</text>
    <text class="node-subtitle" x="110" y="79" font-size="16">lifecycle</text>
  </g>
  <g class="node node-green" transform="translate(1080 365)" filter="url(#shadow)">
    <rect width="220" height="86" rx="18" fill="#ecfdf5" stroke="#15803d"/>
    <use href="#icon-robot" x="16" y="2" width="34" height="34" color="#15803d"/>
    <text class="node-title icon-copy" x="62" y="24.04" font-size="14">Workload C</text>
    <text class="node-subtitle" x="110" y="57" font-size="16">agent or shell ·</text>
    <text class="node-subtitle" x="110" y="79" font-size="16">optional cgroup</text>
  </g>
</svg>
