<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="380" viewBox="0 0 1100 380" role="img" aria-labelledby="title desc">
  <title id="title">The AI product lifecycle</title>
  <desc id="desc">AI products improve in a loop: build, add traces, turn the data into an eval set, fix the problems it shows, and iterate in production with domain experts.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#7c3aed"/></marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#2563eb"/></marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#c2410c"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#15803d"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#dc2626"/></marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#64748b"/></marker>
    <symbol id="icon-database" viewBox="0 0 24 24">
        <ellipse cx="12" cy="5" rx="8" ry="3" fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="M4 5v7c0 1.66 3.58 3 8 3s8-1.34 8-3V5M4 12v7c0 1.66 3.58 3 8 3s8-1.34 8-3v-7" fill="none" stroke="currentColor" stroke-width="2"/>
      </symbol>
    <symbol id="icon-observability" viewBox="0 0 24 24">
        <rect x="2" y="3" width="17" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/>
        <path d="M6 13v-3M10 13V7M14 13V9M7 21h7M10.5 17v4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        <circle cx="18" cy="15" r="4" fill="none" stroke="currentColor" stroke-width="1.8"/>
        <circle cx="18" cy="15" r="1" fill="currentColor"/>
        <path d="m21 18 2 2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </symbol>
    <symbol id="icon-settings" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9 7 7M17 17l2.1 2.1M19.1 4.9 17 7M7 17l-2.1 2.1" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </symbol>
    <symbol id="icon-terminal" viewBox="0 0 24 24">
        <rect x="2.5" y="3" width="19" height="18" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/>
        <path d="M3 7.5h18" fill="none" stroke="currentColor" stroke-width="1.8"/>
        <circle cx="5.5" cy="5.25" r=".75" fill="currentColor"/>
        <circle cx="8" cy="5.25" r=".75" fill="currentColor"/>
        <path d="m7 12 3 2.5-3 2.5M12.5 17h4.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </symbol>
    <symbol id="icon-user" viewBox="0 0 24 24">
        <circle cx="12" cy="8" r="4" fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="M4 22c.6-5 3.3-7 8-7s7.4 2 8 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </symbol>
    <style>
      text { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      symbol [stroke] { vector-effect: non-scaling-stroke; }
      .node rect { stroke-width: 2; }
      .node-boundary rect { stroke-width: 2; stroke-dasharray: 8 8; }
      .boundary-title { font-size: 16px; font-weight: 750; text-anchor: start; }
      .node-title { font-weight: 750; text-anchor: middle; }
      .node-title.icon-copy { text-anchor: start; }
      .node-subtitle { font-weight: 500; fill: #475569; text-anchor: middle; }
      .eyebrow { font-weight: 750; letter-spacing: 1px; fill: #475569; text-anchor: middle; }
      .mention-icon { font-size: 27px; font-weight: 750; text-anchor: middle; }
      .standalone-mention { font-size: 52px; font-weight: 750; text-anchor: middle; }
      .icon-node-title { font-size: 16px; font-weight: 750; text-anchor: middle; }
      .edge { fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
      .edge-label rect { stroke-width: 2; }
      .edge-label text { font-size: 14px; font-weight: 750; text-anchor: middle; dominant-baseline: central; }
      .divider { stroke: #cbd5e1; stroke-width: 2; stroke-dasharray: 6 8; stroke-linecap: round; }
      .center-annotation { fill: #f1f5f9; stroke: none; }
      .center-title { font-weight: 800; letter-spacing: 0.08em; fill: #334155; text-anchor: middle; }
      .center-detail { font-weight: 600; fill: #475569; text-anchor: middle; }
    </style>
  </defs>
  <rect width="1100" height="380" fill="#ffffff"/>

  <path class="edge" d="M300 90L420 90" stroke="#64748b" marker-end="url(#arrow-gray)"/>
  <path class="edge" d="M680 90L800 90" stroke="#64748b" marker-end="url(#arrow-gray)"/>
  <path class="edge" d="M930 140L930 290L870 290" stroke="#64748b" marker-end="url(#arrow-gray)"/>
  <path class="edge" d="M610 290L490 290" stroke="#64748b" marker-end="url(#arrow-gray)"/>
  <path class="edge" d="M230 290H147Q135 290 135 278V140" stroke="#64748b" marker-end="url(#arrow-gray)"/>

  <g class="node node-amber" transform="translate(40 40)" filter="url(#shadow)">
    <rect width="260" height="100" rx="18" fill="#fff7ed" stroke="#c2410c"/>
    <use href="#icon-terminal" x="16" y="30.5" width="34" height="34" color="#c2410c"/>
    <text class="node-title icon-copy" x="62" y="52.9" font-size="15">Build</text>
  </g>
  <g class="node node-purple" transform="translate(420 40)" filter="url(#shadow)">
    <rect width="260" height="100" rx="18" fill="#f5f3ff" stroke="#7c3aed"/>
    <use href="#icon-observability" x="16" y="20" width="34" height="34" color="#7c3aed"/>
    <text class="node-title icon-copy" x="62" y="42.4" font-size="15">Add traces</text>
    <text class="node-subtitle" x="130" y="75" font-size="16">observability</text>
  </g>
  <g class="node node-green" transform="translate(800 40)" filter="url(#shadow)">
    <rect width="260" height="100" rx="18" fill="#ecfdf5" stroke="#15803d"/>
    <use href="#icon-database" x="16" y="20" width="34" height="34" color="#15803d"/>
    <text class="node-title icon-copy" x="62" y="42.4" font-size="15">Build an eval set</text>
    <text class="node-subtitle" x="130" y="75" font-size="16">from real data</text>
  </g>
  <g class="node node-amber" transform="translate(610 240)" filter="url(#shadow)">
    <rect width="260" height="100" rx="18" fill="#fff7ed" stroke="#c2410c"/>
    <use href="#icon-settings" x="16" y="20" width="34" height="34" color="#c2410c"/>
    <text class="node-title icon-copy" x="62" y="42.4" font-size="15">Fix what you see</text>
    <text class="node-subtitle" x="130" y="75" font-size="16">pull the levers</text>
  </g>
  <g class="node node-blue" transform="translate(230 240)" filter="url(#shadow)">
    <rect width="260" height="100" rx="18" fill="#eff6ff" stroke="#2563eb"/>
    <use href="#icon-user" x="16" y="20" width="34" height="34" color="#2563eb"/>
    <text class="node-title icon-copy" x="62" y="42.4" font-size="15">Iterate in production</text>
    <text class="node-subtitle" x="130" y="75" font-size="16">with domain experts</text>
  </g>
</svg>
