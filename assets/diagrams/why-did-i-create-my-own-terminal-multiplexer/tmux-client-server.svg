<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="520" viewBox="0 0 1260 520" role="img" aria-labelledby="title desc">
  <title id="title">After SSH disconnects</title>
  <desc id="desc">The SSH PTY and tmux client stop after a disconnect, but the tmux server keeps its pane PTY and agent running.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#7c3aed"/></marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#2563eb"/></marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#c2410c"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#15803d"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#dc2626"/></marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#64748b"/></marker>
    <marker id="arrow-start-gray" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#64748b"/></marker>
    <symbol id="icon-robot" viewBox="0 0 24 24">
        <path d="M12 5V2.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        <circle cx="12" cy="2.5" r="1" fill="currentColor"/>
        <rect x="4" y="5" width="16" height="15" rx="3" fill="none" stroke="currentColor" stroke-width="1.8"/>
        <path d="M4 10H2.5v5H4M20 10h1.5v5H20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="9" cy="11" r="1.3" fill="currentColor"/>
        <circle cx="15" cy="11" r="1.3" fill="currentColor"/>
        <path d="M8.5 16h7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </symbol>
    <symbol id="icon-settings" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9 7 7M17 17l2.1 2.1M19.1 4.9 17 7M7 17l-2.1 2.1" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </symbol>
    <symbol id="icon-terminal" viewBox="0 0 24 24">
        <rect x="2.5" y="3" width="19" height="18" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/>
        <path d="M3 7.5h18" fill="none" stroke="currentColor" stroke-width="1.8"/>
        <circle cx="5.5" cy="5.25" r=".75" fill="currentColor"/>
        <circle cx="8" cy="5.25" r=".75" fill="currentColor"/>
        <path d="m7 12 3 2.5-3 2.5M12.5 17h4.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </symbol>
    <style>
      text { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      symbol [stroke] { vector-effect: non-scaling-stroke; }
      .node rect { stroke-width: 2; }
      .node-boundary rect { stroke-width: 2; stroke-dasharray: 8 8; }
      .boundary-title { font-size: 16px; font-weight: 750; text-anchor: start; }
      .node-title { font-weight: 750; text-anchor: middle; }
      .node-title.icon-copy { text-anchor: start; }
      .node-subtitle { font-weight: 500; fill: #475569; text-anchor: middle; }
      .eyebrow { font-weight: 750; letter-spacing: 1px; fill: #475569; text-anchor: middle; }
      .mention-icon { font-size: 27px; font-weight: 750; text-anchor: middle; }
      .standalone-mention { font-size: 52px; font-weight: 750; text-anchor: middle; }
      .icon-node-title { font-size: 16px; font-weight: 750; text-anchor: middle; }
      .edge { fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
      .edge-label rect { stroke-width: 2; }
      .edge-label text { font-size: 14px; font-weight: 750; text-anchor: middle; dominant-baseline: central; }
      .divider { stroke: #cbd5e1; stroke-width: 2; stroke-dasharray: 6 8; stroke-linecap: round; }
      .center-annotation { fill: #f1f5f9; stroke: none; }
      .center-title { font-weight: 800; letter-spacing: 0.08em; fill: #334155; text-anchor: middle; }
      .center-detail { font-weight: 600; fill: #475569; text-anchor: middle; }
    </style>
  </defs>
  <rect width="1260" height="520" fill="#ffffff"/>

  <g class="node-boundary node-gray" transform="translate(20 30)">
    <rect width="1220" height="200" rx="22" fill="none" stroke="#64748b"/>
    <text class="boundary-title" x="20" y="31">SSH SESSION · ENDS ON DISCONNECT</text>
  </g>
  <g class="node-boundary node-green" transform="translate(20 280)">
    <rect width="1220" height="210" rx="22" fill="none" stroke="#15803d"/>
    <text class="boundary-title" x="20" y="31">TMUX SERVER AND WORKLOAD · KEEP RUNNING</text>
  </g>
  <path class="edge" d="M220 135L280 135" stroke="#64748b" stroke-dasharray="8 8" marker-start="url(#arrow-start-gray)" marker-end="url(#arrow-gray)"/>
  <path class="edge" d="M460 135L520 135" stroke="#64748b" stroke-dasharray="8 8" marker-start="url(#arrow-start-gray)" marker-end="url(#arrow-gray)"/>
  <path class="edge-boundary-halo" d="M610 185L610 335" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="edge" d="M610 185L610 335" stroke="#64748b" stroke-dasharray="8 8" marker-start="url(#arrow-start-gray)" marker-end="url(#arrow-gray)"/>
  <g class="edge-label" transform="translate(610 260)">
    <rect x="-85.46" y="-16" width="170.92" height="32" rx="16.0" fill="#ffffff" stroke="#64748b"/>
    <text fill="#64748b">Unix socket closed</text>
  </g>
  <path class="edge" d="M700 385L780 385" stroke="#64748b" marker-start="url(#arrow-start-gray)" marker-end="url(#arrow-gray)"/>
  <path class="edge" d="M960 385L1040 385" stroke="#64748b" marker-start="url(#arrow-start-gray)" marker-end="url(#arrow-gray)"/>

  <g class="node node-gray" transform="translate(40 85)" filter="url(#shadow)">
    <rect width="180" height="100" rx="18" fill="#f8fafc" stroke="#64748b"/>
    <use href="#icon-settings" x="16" y="20" width="34" height="34" color="#64748b"/>
    <text class="node-title icon-copy" x="62" y="42.04" font-size="14">sshd</text>
    <text class="node-subtitle" x="90" y="75" font-size="16">connection closed</text>
  </g>
  <g class="node node-gray" transform="translate(280 85)" filter="url(#shadow)">
    <rect width="180" height="100" rx="18" fill="#f8fafc" stroke="#64748b"/>
    <text class="node-title" x="90" y="42.04" font-size="14">SSH PTY</text>
    <text class="node-subtitle" x="90" y="75" font-size="16">closed</text>
  </g>
  <g class="node node-gray" transform="translate(520 85)" filter="url(#shadow)">
    <rect width="180" height="100" rx="18" fill="#f8fafc" stroke="#64748b"/>
    <use href="#icon-terminal" x="16" y="20" width="34" height="34" color="#64748b"/>
    <text class="node-title icon-copy" x="62" y="42.04" font-size="14">tmux client</text>
    <text class="node-subtitle" x="90" y="75" font-size="16">exits</text>
  </g>
  <g class="node node-green" transform="translate(520 335)" filter="url(#shadow)">
    <rect width="180" height="100" rx="18" fill="#ecfdf5" stroke="#15803d"/>
    <use href="#icon-settings" x="16" y="20" width="34" height="34" color="#15803d"/>
    <text class="node-title icon-copy" x="62" y="42.04" font-size="14">tmux server</text>
    <text class="node-subtitle" x="90" y="75" font-size="16">still running</text>
  </g>
  <g class="node node-purple" transform="translate(780 335)" filter="url(#shadow)">
    <rect width="180" height="100" rx="18" fill="#f5f3ff" stroke="#7c3aed"/>
    <text class="node-title" x="90" y="42.04" font-size="14">Pane PTY</text>
    <text class="node-subtitle" x="90" y="75" font-size="16">still open</text>
  </g>
  <g class="node node-amber" transform="translate(1040 335)" filter="url(#shadow)">
    <rect width="180" height="100" rx="18" fill="#fff7ed" stroke="#c2410c"/>
    <use href="#icon-robot" x="16" y="20" width="34" height="34" color="#c2410c"/>
    <text class="node-title icon-copy" x="62" y="42.04" font-size="14">Agent</text>
    <text class="node-subtitle" x="90" y="75" font-size="16">still running</text>
  </g>
</svg>
