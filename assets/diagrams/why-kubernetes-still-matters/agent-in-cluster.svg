<svg xmlns="http://www.w3.org/2000/svg" width="980" height="640" viewBox="0 0 980 640" role="img" aria-labelledby="title desc">
  <title id="title">The SRE agent as cluster infrastructure</title>
  <desc id="desc">An alert wakes the SRE agent inside the Kubernetes cluster, where it&#x27;s deployed from Git and calls the API as its own service account. Its logs and metrics go to monitoring, and it pages the on-call engineer only when it can&#x27;t fix the incident.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#7c3aed"/></marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#2563eb"/></marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#c2410c"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#15803d"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#dc2626"/></marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#64748b"/></marker>
    <symbol id="icon-alert" viewBox="0 0 24 24">
        <path d="M5 17h14l-2-3V9a5 5 0 0 0-10 0v5Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M10 20h4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </symbol>
    <symbol id="icon-api" viewBox="0 0 24 24">
        <path d="m8 5-5 7 5 7M16 5l5 7-5 7M14 3l-4 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </symbol>
    <symbol id="icon-github" viewBox="0 0 24 24">
        <path fill="currentColor" d="M12 .7a11.5 11.5 0 0 0-3.64 22.41c.58.11.79-.25.79-.56v-2.23c-3.22.7-3.9-1.37-3.9-1.37-.53-1.34-1.29-1.7-1.29-1.7-1.05-.72.08-.71.08-.71 1.17.08 1.78 1.2 1.78 1.2 1.04 1.77 2.72 1.26 3.38.96.1-.75.4-1.26.74-1.55-2.57-.29-5.27-1.28-5.27-5.68 0-1.26.45-2.28 1.19-3.09-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.16 1.18a10.9 10.9 0 0 1 5.76 0c2.2-1.49 3.16-1.18 3.16-1.18.63 1.59.23 2.76.11 3.05.74.81 1.19 1.83 1.19 3.09 0 4.42-2.71 5.38-5.29 5.67.42.36.79 1.06.79 2.14v3.27c0 .31.21.67.8.56A11.5 11.5 0 0 0 12 .7Z"/>
      </symbol>
    <symbol id="icon-observability" viewBox="0 0 24 24">
        <rect x="2" y="3" width="17" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/>
        <path d="M6 13v-3M10 13V7M14 13V9M7 21h7M10.5 17v4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        <circle cx="18" cy="15" r="4" fill="none" stroke="currentColor" stroke-width="1.8"/>
        <circle cx="18" cy="15" r="1" fill="currentColor"/>
        <path d="m21 18 2 2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </symbol>
    <symbol id="icon-robot" viewBox="0 0 24 24">
        <path d="M12 5V2.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        <circle cx="12" cy="2.5" r="1" fill="currentColor"/>
        <rect x="4" y="5" width="16" height="15" rx="3" fill="none" stroke="currentColor" stroke-width="1.8"/>
        <path d="M4 10H2.5v5H4M20 10h1.5v5H20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="9" cy="11" r="1.3" fill="currentColor"/>
        <circle cx="15" cy="11" r="1.3" fill="currentColor"/>
        <path d="M8.5 16h7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </symbol>
    <symbol id="icon-user" viewBox="0 0 24 24">
        <circle cx="12" cy="8" r="4" fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="M4 22c.6-5 3.3-7 8-7s7.4 2 8 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </symbol>
    <style>
      text { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      symbol [stroke] { vector-effect: non-scaling-stroke; }
      .node rect { stroke-width: 2; }
      .node-boundary rect { stroke-width: 2; stroke-dasharray: 8 8; }
      .boundary-title { font-size: 16px; font-weight: 750; text-anchor: start; }
      .node-title { font-weight: 750; text-anchor: middle; }
      .node-title.icon-copy { text-anchor: start; }
      .node-subtitle { font-weight: 500; fill: #475569; text-anchor: middle; }
      .eyebrow { font-weight: 750; letter-spacing: 1px; fill: #475569; text-anchor: middle; }
      .mention-icon { font-size: 27px; font-weight: 750; text-anchor: middle; }
      .standalone-mention { font-size: 52px; font-weight: 750; text-anchor: middle; }
      .icon-node-title { font-size: 16px; font-weight: 750; text-anchor: middle; }
      .edge { fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
      .edge-label rect { stroke-width: 2; }
      .edge-label text { font-size: 14px; font-weight: 750; text-anchor: middle; dominant-baseline: central; }
      .divider { stroke: #cbd5e1; stroke-width: 2; stroke-dasharray: 6 8; stroke-linecap: round; }
      .center-annotation { fill: #f1f5f9; stroke: none; }
      .center-title { font-weight: 800; letter-spacing: 0.08em; fill: #334155; text-anchor: middle; }
      .center-detail { font-weight: 600; fill: #475569; text-anchor: middle; }
    </style>
  </defs>
  <rect width="980" height="640" fill="#ffffff"/>

  <g class="node-boundary node-gray" transform="translate(170 148)">
    <rect width="770" height="350" rx="22" fill="none" stroke="#64748b"/>
    <text class="boundary-title" x="20" y="31">Kubernetes cluster</text>
  </g>
  <path class="edge-boundary-halo" d="M143 68L400 68L400 228" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="edge" d="M143 68L400 68L400 228" stroke="#64748b" marker-end="url(#arrow-gray)"/>
  <g class="edge-label" transform="translate(400 68)">
    <rect x="-38.56" y="-16" width="77.11" height="32" rx="16.0" fill="#ffffff" stroke="#64748b"/>
    <text fill="#64748b">GitOps</text>
  </g>
  <path class="edge-boundary-halo" d="M136 303L260 303" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="edge" d="M136 303L260 303" stroke="#dc2626" marker-end="url(#arrow-red)"/>
  <path class="edge" d="M540 278L680 278" stroke="#15803d" marker-end="url(#arrow-green)"/>
  <path class="edge" d="M540 328H610V418H680" stroke="#15803d" marker-end="url(#arrow-green)"/>
  <path class="edge-boundary-halo" d="M400 378L400 538L136 538" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="edge" d="M400 378L400 538L136 538" stroke="#2563eb" stroke-dasharray="8 8" marker-end="url(#arrow-blue)"/>
  <g class="edge-label" transform="translate(400 538)">
    <rect x="-52.56" y="-16" width="105.11" height="32" rx="16.0" fill="#ffffff" stroke="#2563eb"/>
    <text fill="#2563eb">Can&#x27;t fix it</text>
  </g>

  <g class="node-icon-only node-gray" transform="translate(87 40)">
    <use href="#icon-github" x="0" y="0" width="56" height="56" color="#64748b"/>
    <text class="icon-node-title" x="28" y="81">Git repo</text>
  </g>
  <g class="node-icon-only node-red" transform="translate(87 275)">
    <use href="#icon-alert" x="0" y="0" width="56" height="56" color="#dc2626"/>
    <text class="icon-node-title" x="28" y="81">Alert</text>
  </g>
  <g class="node node-purple" transform="translate(260 228)" filter="url(#shadow)">
    <rect width="280" height="150" rx="18" fill="#f5f3ff" stroke="#7c3aed"/>
    <text class="eyebrow" x="140" y="45" font-size="13">POD</text>
    <use href="#icon-robot" x="16" y="55" width="34" height="34" color="#7c3aed"/>
    <text class="node-title icon-copy" x="62" y="78.48" font-size="18">SRE agent</text>
    <text class="node-subtitle" x="140" y="110" font-size="16">Investigates incidents</text>
  </g>
  <g class="node node-green" transform="translate(680 228)" filter="url(#shadow)">
    <rect width="240" height="100" rx="18" fill="#ecfdf5" stroke="#15803d"/>
    <use href="#icon-api" x="16" y="20" width="34" height="34" color="#15803d"/>
    <text class="node-title icon-copy" x="62" y="43.48" font-size="18">Kubernetes API</text>
    <text class="node-subtitle" x="120" y="75" font-size="16">RBAC checks every call</text>
  </g>
  <g class="node node-green" transform="translate(680 368)" filter="url(#shadow)">
    <rect width="240" height="100" rx="18" fill="#ecfdf5" stroke="#15803d"/>
    <use href="#icon-observability" x="16" y="20" width="34" height="34" color="#15803d"/>
    <text class="node-title icon-copy" x="62" y="43.48" font-size="18">Monitoring</text>
    <text class="node-subtitle" x="120" y="75" font-size="16">Logs and metrics</text>
  </g>
  <g class="node-icon-only node-blue" transform="translate(87 510)">
    <use href="#icon-user" x="0" y="0" width="56" height="56" color="#2563eb"/>
    <text class="icon-node-title" x="28" y="81">On-call engineer</text>
  </g>
  <g class="node-attached node-purple" transform="translate(465 208)" filter="url(#shadow)">
    <rect width="150" height="40" rx="14" fill="#f5f3ff" stroke="#7c3aed"/>
    <text class="attached-title" x="75" y="25.76" font-size="16" font-weight="750" text-anchor="middle">ServiceAccount</text>
  </g>
</svg>
