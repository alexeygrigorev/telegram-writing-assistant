<svg xmlns="http://www.w3.org/2000/svg" width="940" height="740" viewBox="0 0 940 740" role="img" aria-labelledby="title desc">
  <title id="title">Policy and RBAC guardrails</title>
  <desc id="desc">The policy file decides whether each proposed action runs on its own, waits for a human, or is blocked. Whatever gets through still hits the Kubernetes API, where RBAC lets the agent only delete pods and scale deployments.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#7c3aed"/></marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#2563eb"/></marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#c2410c"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#15803d"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#dc2626"/></marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#64748b"/></marker>
    <symbol id="icon-api" viewBox="0 0 24 24">
        <path d="m8 5-5 7 5 7M16 5l5 7-5 7M14 3l-4 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </symbol>
    <symbol id="icon-check" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="m7.5 12 3 3 6-7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </symbol>
    <symbol id="icon-close" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="m8 8 8 8M16 8l-8 8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </symbol>
    <symbol id="icon-document" viewBox="0 0 24 24">
        <path d="M6 2h8l4 4v16H6Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M14 2v5h4M9 12h6M9 16h6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </symbol>
    <symbol id="icon-robot" viewBox="0 0 24 24">
        <path d="M12 5V2.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        <circle cx="12" cy="2.5" r="1" fill="currentColor"/>
        <rect x="4" y="5" width="16" height="15" rx="3" fill="none" stroke="currentColor" stroke-width="1.8"/>
        <path d="M4 10H2.5v5H4M20 10h1.5v5H20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="9" cy="11" r="1.3" fill="currentColor"/>
        <circle cx="15" cy="11" r="1.3" fill="currentColor"/>
        <path d="M8.5 16h7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </symbol>
    <symbol id="icon-user" viewBox="0 0 24 24">
        <circle cx="12" cy="8" r="4" fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="M4 22c.6-5 3.3-7 8-7s7.4 2 8 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </symbol>
    <style>
      text { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      symbol [stroke] { vector-effect: non-scaling-stroke; }
      .node rect { stroke-width: 2; }
      .node-boundary rect { stroke-width: 2; stroke-dasharray: 8 8; }
      .boundary-title { font-size: 16px; font-weight: 750; text-anchor: start; }
      .node-title { font-weight: 750; text-anchor: middle; }
      .node-title.icon-copy { text-anchor: start; }
      .node-subtitle { font-weight: 500; fill: #475569; text-anchor: middle; }
      .eyebrow { font-weight: 750; letter-spacing: 1px; fill: #475569; text-anchor: middle; }
      .mention-icon { font-size: 27px; font-weight: 750; text-anchor: middle; }
      .standalone-mention { font-size: 52px; font-weight: 750; text-anchor: middle; }
      .icon-node-title { font-size: 16px; font-weight: 750; text-anchor: middle; }
      .edge { fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
      .edge-label rect { stroke-width: 2; }
      .edge-label text { font-size: 14px; font-weight: 750; text-anchor: middle; dominant-baseline: central; }
      .divider { stroke: #cbd5e1; stroke-width: 2; stroke-dasharray: 6 8; stroke-linecap: round; }
      .center-annotation { fill: #f1f5f9; stroke: none; }
      .center-title { font-weight: 800; letter-spacing: 0.08em; fill: #334155; text-anchor: middle; }
      .center-detail { font-weight: 600; fill: #475569; text-anchor: middle; }
    </style>
  </defs>
  <rect width="940" height="740" fill="#ffffff"/>

  <path class="edge" d="M470 140L470 200" stroke="#64748b" marker-end="url(#arrow-gray)"/>
  <path class="edge" d="M470 300V340H170V380" stroke="#64748b" marker-end="url(#arrow-gray)"/>
  <path class="edge" d="M470 300L470 380" stroke="#64748b" marker-end="url(#arrow-gray)"/>
  <path class="edge" d="M470 300V340H770V380" stroke="#64748b" marker-end="url(#arrow-gray)"/>
  <path class="edge" d="M170 500L170 580" stroke="#15803d" marker-end="url(#arrow-green)"/>
  <path class="edge" d="M470 500L470 640L300 640" stroke="#15803d" marker-end="url(#arrow-green)"/>
  <g class="edge-label" transform="translate(470 640)">
    <rect x="-50.06" y="-16" width="100.13" height="32" rx="16.0" fill="#ffffff" stroke="#15803d"/>
    <text fill="#15803d">Approved</text>
  </g>

  <g class="node node-purple" transform="translate(340 40)" filter="url(#shadow)">
    <rect width="260" height="100" rx="18" fill="#f5f3ff" stroke="#7c3aed"/>
    <use href="#icon-robot" x="16" y="20" width="34" height="34" color="#7c3aed"/>
    <text class="node-title icon-copy" x="62" y="44.2" font-size="20">SRE agent</text>
    <text class="node-subtitle" x="130" y="75" font-size="16">Proposes a fix</text>
  </g>
  <g class="node node-amber" transform="translate(340 200)" filter="url(#shadow)">
    <rect width="260" height="100" rx="18" fill="#fff7ed" stroke="#c2410c"/>
    <use href="#icon-document" x="16" y="20" width="34" height="34" color="#c2410c"/>
    <text class="node-title icon-copy" x="62" y="44.2" font-size="20">Policy file</text>
    <text class="node-subtitle" x="130" y="75" font-size="16">Autonomy level per action</text>
  </g>
  <g class="node node-purple" transform="translate(40 380)" filter="url(#shadow)">
    <rect width="260" height="120" rx="18" fill="#f5f3ff" stroke="#7c3aed"/>
    <use href="#icon-check" x="16" y="19" width="34" height="34" color="#7c3aed"/>
    <text class="node-title icon-copy" x="62" y="43.2" font-size="20">Auto-run</text>
    <text class="node-subtitle" x="130" y="74" font-size="16">Silence alert</text>
    <text class="node-subtitle" x="130" y="96" font-size="16">Restart pod in dev</text>
  </g>
  <g class="node node-blue" transform="translate(340 380)" filter="url(#shadow)">
    <rect width="260" height="120" rx="18" fill="#eff6ff" stroke="#2563eb"/>
    <use href="#icon-user" x="16" y="19" width="34" height="34" color="#2563eb"/>
    <text class="node-title icon-copy" x="62" y="43.2" font-size="20">Ask a human</text>
    <text class="node-subtitle" x="130" y="74" font-size="16">Roll back</text>
    <text class="node-subtitle" x="130" y="96" font-size="16">Restart pod in prod</text>
  </g>
  <g class="node node-gray" transform="translate(640 380)" filter="url(#shadow)">
    <rect width="260" height="120" rx="18" fill="#f8fafc" stroke="#64748b"/>
    <use href="#icon-close" x="16" y="19" width="34" height="34" color="#64748b"/>
    <text class="node-title icon-copy" x="62" y="43.2" font-size="20">Blocked</text>
    <text class="node-subtitle" x="130" y="74" font-size="16">Delete namespace</text>
    <text class="node-subtitle" x="130" y="96" font-size="16">Drain node</text>
  </g>
  <g class="node node-green" transform="translate(40 580)" filter="url(#shadow)">
    <rect width="260" height="120" rx="18" fill="#ecfdf5" stroke="#15803d"/>
    <use href="#icon-api" x="16" y="19" width="34" height="34" color="#15803d"/>
    <text class="node-title icon-copy" x="62" y="43.2" font-size="20">Kubernetes API</text>
    <text class="node-subtitle" x="130" y="74" font-size="16">RBAC allows only</text>
    <text class="node-subtitle" x="130" y="96" font-size="16">pod delete and scale</text>
  </g>
</svg>
